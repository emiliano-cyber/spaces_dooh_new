<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACE EYE — Galeria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/src/css/styles.css">
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased">
  <div x-data="gallery()" x-init="init()" class="min-h-screen">

    <div id="app-header"></div>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <div class="flex gap-3 mb-6 flex-wrap">
        <input x-model="filters.from" type="date" class="px-3 py-2 border border-neutral-300 rounded text-sm">
        <input x-model="filters.to" type="date" class="px-3 py-2 border border-neutral-300 rounded text-sm">
        <select x-model="filters.source" class="px-3 py-2 border border-neutral-300 rounded text-sm">
          <option value="">Todas las fuentes</option>
          <option value="manual">Manual</option>
          <option value="scheduled">Programada</option>
          <option value="on_demand">On demand</option>
        </select>
        <button @click="loadPhotos()" class="px-4 py-2 bg-[#0A66FF] text-white text-sm rounded hover:bg-blue-700">Filtrar</button>
        <button @click="downloadAlbum()" :disabled="albumDownloading"
          class="px-4 py-2 bg-green-600 text-white text-sm rounded hover:bg-green-700 disabled:opacity-50">
          <span x-text="albumDownloading ? ('Descargando ' + albumProgress) : 'Descargar álbum'"></span>
        </button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        <template x-for="photo in photos" :key="photo.id">
          <div class="bg-white border border-neutral-200 rounded-lg overflow-hidden">
            <div class="relative group aspect-[4/3] bg-neutral-100">
              <img :src="photo.thumbnail_path" @click="openLightbox(photo)"
                   :style="giroDeFoto(photo) ? `transform: rotate(${giroDeFoto(photo)}deg)` : ''"
                   class="w-full h-full object-contain cursor-pointer hover:opacity-90" :alt="'Photo ' + photo.id">
              <button @click.stop="deletePhoto(photo.id)" title="Eliminar fotografía"
                class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 bg-red-600/90 hover:bg-red-700 text-white rounded p-1.5 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-7 0v11a2 2 0 002 2h4a2 2 0 002-2V7"/></svg>
              </button>
            </div>
            <div class="p-2 text-xs">
              <div class="font-medium" x-text="photo.device_name"></div>
              <div class="text-neutral-500" x-text="new Date(photo.taken_at).toLocaleString()"></div>
              <div class="mt-1">
                <span :class="{
                  'text-green-600': photo.verification_status === 'verified' && photo.is_correct,
                  'text-red-600': photo.verification_status === 'verified' && !photo.is_correct,
                  'text-neutral-400': photo.verification_status !== 'verified'
                }" x-text="photo.verification_status"></span>
              </div>
            </div>
          </div>
        </template>
      </div>

      <div x-show="photos.length === 0" class="text-center py-16 text-neutral-500">
        Sin fotos para los filtros seleccionados
      </div>

      <div class="flex justify-center mt-8 gap-2" x-show="totalPages > 1">
        <button @click="page > 1 && (page--, loadPhotos())" :disabled="page <= 1"
          class="px-3 py-1 text-sm border rounded disabled:opacity-50">&larr; Anterior</button>
        <span class="px-3 py-1 text-sm" x-text="'Pagina ' + page + ' de ' + totalPages"></span>
        <button @click="page < totalPages && (page++, loadPhotos())" :disabled="page >= totalPages"
          class="px-3 py-1 text-sm border rounded disabled:opacity-50">Siguiente &rarr;</button>
      </div>
    </main>

    <!-- Visor de foto en grande -->
    <div x-show="lightbox" x-transition.opacity @click="lightbox = null" style="display:none"
         class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 cursor-zoom-out">
      <div class="relative inline-block" @click.stop>
        <img :src="lightbox?.storage_path" x-ref="lbimg"
             @load="lbImgW = $refs.lbimg.clientWidth"
             :style="'transform: rotate(' + (lbRotation + giroDeFoto(lightbox)) + 'deg)'"
             class="max-w-full max-h-[85vh] object-contain rounded shadow-2xl transition-transform">
        <div x-show="lightbox && (lightbox.watermark_baked === 0 || lightbox.watermark_baked === false) && (lightbox.overlay_enabled === 1 || lightbox.overlay_enabled === true)"
             class="absolute pointer-events-none whitespace-pre" :style="overlayCss(lightbox)">
          <template x-for="l in overlayInfoLinesFor(lightbox)" :key="l"><div x-text="l"></div></template>
        </div>
      </div>
      <button @click.stop="lightbox = null"
              class="absolute top-4 right-6 text-white/80 hover:text-white text-4xl leading-none">&times;</button>
      <div class="absolute bottom-4 left-0 right-0 flex flex-wrap items-center justify-center gap-3 text-white/80 text-sm">
        <span x-text="lightbox ? ((lightbox.device_name || '') + ' · ' + new Date(lightbox.taken_at).toLocaleString('es-MX') + (lightbox.gps_lat ? ' · GPS ' + Number(lightbox.gps_lat).toFixed(5) + ', ' + Number(lightbox.gps_lng).toFixed(5) : '')) : ''"></span>
        <button @click.stop="rotateLightbox()"
                class="flex items-center gap-1.5 bg-white/15 hover:bg-white/25 text-white px-3 py-1.5 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5 9a7 7 0 0111.9-2.9M19 15a7 7 0 01-11.9 2.9"/></svg>
          Rotar
        </button>
        <button @click.stop="downloadCurrentPhoto()"
                class="flex items-center gap-1.5 bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
          Descargar
        </button>
        <button @click.stop="deletePhoto(lightbox.id)"
                class="flex items-center gap-1.5 bg-red-600/90 hover:bg-red-700 text-white px-3 py-1.5 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-7 0v11a2 2 0 002 2h4a2 2 0 002-2V7"/></svg>
          Eliminar
        </button>
      </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" style="display:none" x-transition
         class="fixed bottom-6 right-6 z-[70] px-4 py-3 rounded-lg shadow-lg text-sm text-white"
         :class="{ 'bg-green-600': toast.type === 'success', 'bg-red-600': toast.type === 'error', 'bg-neutral-800': toast.type === 'info' }">
      <span x-text="toast.msg"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="/src/js/api.js"></script>
  <script src="/src/js/shell.js"></script>
  <script src="/src/js/photo-utils.js"></script>
  <script src="/src/js/pages/gallery.js"></script>
</body>
</html>

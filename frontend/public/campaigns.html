<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACE EYE — Campanas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/src/css/styles.css">
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased">
  <div x-data="campaignsPage()" x-init="init()" class="min-h-screen">

    <header class="bg-white border-b border-neutral-200 sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-[#0A66FF] rounded flex items-center justify-center text-white font-bold">E</div>
          <h1 class="text-lg font-medium">Campanas</h1>
        </div>
        <nav class="flex items-center gap-4 text-sm">
          <a href="/dashboard.html" class="text-neutral-500 hover:text-neutral-900">Devices</a>
          <a href="/gallery.html" class="text-neutral-500 hover:text-neutral-900">Galeria</a>
          <a href="/scheduler.html" class="text-neutral-500 hover:text-neutral-900">Programacion</a>
          <a href="/campaigns.html" class="text-blue-600 font-medium">Campanas</a>
          <a href="/verification.html" class="text-neutral-500 hover:text-neutral-900">Verificacion</a>
        </nav>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-medium">Campanas publicitarias</h2>
        <button @click="showForm = !showForm" class="px-4 py-2 bg-[#0A66FF] text-white text-sm rounded hover:bg-blue-700">
          + Nueva campana
        </button>
      </div>

      <!-- Create form -->
      <div x-show="showForm" x-cloak class="bg-white border border-neutral-200 rounded-lg p-6 mb-6">
        <h3 class="font-medium mb-4">Crear campana</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-neutral-700 mb-1">Nombre</label>
            <input x-model="form.name" type="text" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
          <div>
            <label class="block text-sm text-neutral-700 mb-1">Anunciante</label>
            <input x-model="form.advertiser" type="text" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
          <div>
            <label class="block text-sm text-neutral-700 mb-1">Fecha inicio</label>
            <input x-model="form.start_date" type="date" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
          <div>
            <label class="block text-sm text-neutral-700 mb-1">Fecha fin</label>
            <input x-model="form.end_date" type="date" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
          <div class="flex items-center gap-2">
            <input x-model="form.verification_enabled" type="checkbox" class="rounded">
            <label class="text-sm text-neutral-700">Habilitar verificacion con IA</label>
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <button @click="createCampaign()" class="px-4 py-2 bg-[#0A66FF] text-white text-sm rounded hover:bg-blue-700">Crear</button>
          <button @click="showForm = false" class="px-4 py-2 bg-neutral-100 text-neutral-700 text-sm rounded hover:bg-neutral-200">Cancelar</button>
        </div>
      </div>

      <!-- Campaigns grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="c in campaigns" :key="c.id">
          <div class="bg-white border border-neutral-200 rounded-lg p-4">
            <div class="flex items-start justify-between mb-2">
              <h3 class="font-medium" x-text="c.name"></h3>
              <span :class="c.active ? 'bg-green-100 text-green-700' : 'bg-neutral-100 text-neutral-500'"
                    class="text-xs px-2 py-0.5 rounded-full" x-text="c.active ? 'Activa' : 'Inactiva'"></span>
            </div>
            <p class="text-sm text-neutral-500 mb-3" x-text="c.advertiser || 'Sin anunciante'"></p>
            <div class="grid grid-cols-3 gap-2 text-xs">
              <div>
                <div class="text-neutral-500">Devices</div>
                <div class="font-medium" x-text="c.device_count"></div>
              </div>
              <div>
                <div class="text-neutral-500">Fotos</div>
                <div class="font-medium" x-text="c.photo_count"></div>
              </div>
              <div>
                <div class="text-neutral-500">Periodo</div>
                <div class="font-medium" x-text="c.start_date + ' / ' + c.end_date"></div>
              </div>
            </div>
            <div class="mt-3 pt-3 border-t border-neutral-100">
              <span x-show="c.verification_enabled" class="text-xs text-blue-600">IA Verificacion activa</span>
              <span x-show="!c.verification_enabled" class="text-xs text-neutral-400">Sin verificacion</span>
            </div>
          </div>
        </template>
      </div>
      <p x-show="campaigns.length === 0" class="text-center py-16 text-neutral-500">No hay campanas creadas</p>
    </main>
  </div>

  <script src="/src/js/api.js"></script>
  <script src="/src/js/pages/campaigns.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACE EYE — Programacion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/src/css/styles.css">
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased">
  <div x-data="schedulerPage()" x-init="init()" class="min-h-screen">

    <div id="app-header"></div>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-medium">Schedules activos</h2>
        <button @click="showForm = !showForm" class="px-4 py-2 bg-[#0A66FF] text-white text-sm rounded hover:bg-blue-700">
          + Nuevo schedule
        </button>
      </div>

      <!-- Create form -->
      <div x-show="showForm" x-cloak class="bg-white border border-neutral-200 rounded-lg p-6 mb-6">
        <h3 class="font-medium mb-4">Crear schedule</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-neutral-700 mb-1">Nombre</label>
            <input x-model="form.name" type="text" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
          <div>
            <label class="block text-sm text-neutral-700 mb-1">Tipo de frecuencia</label>
            <select x-model="form.frequency_type" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
              <option value="interval">Intervalo (minutos)</option>
              <option value="cron">Cron expression</option>
              <option value="specific_times">Horarios especificos</option>
            </select>
          </div>
          <div x-show="form.frequency_type === 'interval'">
            <label class="block text-sm text-neutral-700 mb-1">Intervalo (minutos)</label>
            <input x-model.number="form.interval_minutes" type="number" min="1" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
          <div x-show="form.frequency_type === 'cron'">
            <label class="block text-sm text-neutral-700 mb-1">Cron expression</label>
            <input x-model="form.cron_expression" type="text" placeholder="*/30 * * * *" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
          <div x-show="form.frequency_type === 'specific_times'">
            <label class="block text-sm text-neutral-700 mb-1">Horarios (separados por coma)</label>
            <input x-model="form.specific_times_input" type="text" placeholder="08:00,12:00,18:00" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
          <div>
            <label class="block text-sm text-neutral-700 mb-1">Device ID (opcional)</label>
            <input x-model.number="form.device_id" type="number" class="w-full px-3 py-2 border border-neutral-300 rounded text-sm">
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <button @click="createSchedule()" class="px-4 py-2 bg-[#0A66FF] text-white text-sm rounded hover:bg-blue-700">Crear</button>
          <button @click="showForm = false" class="px-4 py-2 bg-neutral-100 text-neutral-700 text-sm rounded hover:bg-neutral-200">Cancelar</button>
        </div>
      </div>

      <!-- Schedules list -->
      <div class="bg-white border border-neutral-200 rounded-lg overflow-x-auto">
        <table class="w-full text-sm min-w-[640px]">
          <thead class="bg-neutral-50 border-b border-neutral-200">
            <tr>
              <th class="text-left px-4 py-3 font-medium text-neutral-700">Nombre</th>
              <th class="text-left px-4 py-3 font-medium text-neutral-700">Tipo</th>
              <th class="text-left px-4 py-3 font-medium text-neutral-700">Device</th>
              <th class="text-left px-4 py-3 font-medium text-neutral-700">Proximo</th>
              <th class="text-left px-4 py-3 font-medium text-neutral-700">Estado</th>
              <th class="text-left px-4 py-3 font-medium text-neutral-700">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="s in schedules" :key="s.id">
              <tr class="border-b border-neutral-100">
                <td class="px-4 py-3" x-text="s.name"></td>
                <td class="px-4 py-3" x-text="s.frequency_type"></td>
                <td class="px-4 py-3" x-text="s.device_name || 'Grupo/Campana'"></td>
                <td class="px-4 py-3" x-text="s.next_fire_at ? new Date(s.next_fire_at).toLocaleString() : '—'"></td>
                <td class="px-4 py-3">
                  <span :class="s.active ? 'text-green-600' : 'text-neutral-400'" x-text="s.active ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td class="px-4 py-3">
                  <button @click="toggleSchedule(s)" class="text-blue-600 hover:underline text-xs mr-2" x-text="s.active ? 'Pausar' : 'Activar'"></button>
                  <button @click="deleteSchedule(s.id)" class="text-red-600 hover:underline text-xs">Eliminar</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <p x-show="schedules.length === 0" class="text-center py-8 text-neutral-500">No hay schedules configurados</p>
      </div>
    </main>
  </div>

  <script src="/src/js/api.js"></script>
  <script src="/src/js/shell.js"></script>
  <script src="/src/js/pages/scheduler.js"></script>
</body>
</html>

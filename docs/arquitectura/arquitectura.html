<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPACE OS — Arquitectura y Flujos</title>
<style>
:root{
  --bg:#0a0c10; --bg2:#0e1117; --panel:#12161d; --panel2:#171c25;
  --linea:#242c38; --linea2:#2f3846;
  --tx:#e6edf3; --tx2:#9aa7b8; --tx3:#6b7889;
  --acento:#f5c542; --acento2:#ffd76a;
  --sal:#f59e0b; --ent:#38bdf8;
  --sombra:0 8px 32px rgba(0,0,0,.55);
  --r:10px;
  --c-actores:#f59e0b; --c-borde:#a78bfa; --c-jobs:#f472b6; --c-frontend:#38bdf8;
  --c-datos-cliente:#22d3ee; --c-api:#4ade80; --c-controllers:#facc15; --c-repos:#fb923c;
  --c-infra:#94a3b8; --c-datos:#f87171; --c-externo:#c084fc; --c-devops:#64748b;
}
html[data-tema="claro"]{
  --bg:#f4f6fa; --bg2:#eef1f6; --panel:#ffffff; --panel2:#f7f9fc;
  --linea:#dde3ec; --linea2:#c8d1de;
  --tx:#121821; --tx2:#4a5666; --tx3:#78859a;
  --acento:#b8860b; --acento2:#8a6508;
  --sal:#b45309; --ent:#0369a1;
  --sombra:0 8px 28px rgba(20,30,50,.12);
  --c-actores:#b45309; --c-borde:#6d28d9; --c-jobs:#be185d; --c-frontend:#0369a1;
  --c-datos-cliente:#0e7490; --c-api:#15803d; --c-controllers:#a16207; --c-repos:#c2410c;
  --c-infra:#475569; --c-datos:#b91c1c; --c-externo:#7e22ce; --c-devops:#334155;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--linea2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ── Cabecera ─────────────────────────────────────────────── */
header{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  border-bottom:1px solid var(--linea);background:var(--bg2);
  position:relative;z-index:40;flex-wrap:wrap;
}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--acento),#e08a2b);
  display:grid;place-items:center;color:#171000;font-weight:800;font-size:13px;
}
.marca h1{margin:0;font-size:14.5px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.marca span{display:block;font-size:11.5px;color:var(--tx3);font-weight:400}

.buscador{position:relative;flex:1 1 260px;max-width:420px;min-width:180px}
.buscador input{
  width:100%;padding:8px 12px 8px 32px;border-radius:8px;
  background:var(--panel);border:1px solid var(--linea);color:var(--tx);font:inherit;font-size:13px;outline:none;
}
.buscador input:focus{border-color:var(--acento);box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 18%,transparent)}
.buscador svg{position:absolute;left:10px;top:9px;width:14px;height:14px;stroke:var(--tx3);fill:none;stroke-width:2}
.sugerencias{
  position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:340px;overflow:auto;
  background:var(--panel);border:1px solid var(--linea);border-radius:10px;box-shadow:var(--sombra);
  display:none;z-index:60;padding:4px;
}
.sugerencias.abierto{display:block}
.sug{padding:7px 10px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.sug:hover,.sug.sel{background:var(--panel2)}
.sug b{font-weight:600;font-size:12.8px}
.sug i{font-style:normal;color:var(--tx3);font-size:11px;display:block;margin-top:1px;word-break:break-all}
.punto{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:5px}

.acciones{display:flex;gap:6px;align-items:center;margin-left:auto}
.btn{
  padding:7px 11px;border-radius:8px;border:1px solid var(--linea);background:var(--panel);
  font-size:12.5px;color:var(--tx2);transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--linea2);color:var(--tx);background:var(--panel2)}
.btn.on{border-color:var(--acento);color:var(--acento)}
.salto{
  display:flex;align-items:center;gap:2px;padding:2px 4px 2px 9px;border-radius:8px;
  border:1px solid var(--linea);background:var(--panel);
}
.salto>span{font-size:11px;color:var(--tx3);margin-right:4px}
.salto button{padding:4px 8px;border-radius:6px;font-size:12px;color:var(--tx3);line-height:1.1}
.salto button:hover{color:var(--tx)}
.salto button.on{background:var(--panel2);color:var(--acento);font-weight:600}

/* Clave de colores de la vecindad, dentro de la ficha del nodo */
.clave{display:flex;gap:12px;margin:8px 0 0;font-size:11px;color:var(--tx3);flex-wrap:wrap}
.clave i{font-style:normal;display:flex;align-items:center;gap:5px}
.clave i::before{content:'';width:13px;height:2.5px;border-radius:2px;background:currentColor}
.clave .s{color:var(--sal)} .clave .e{color:var(--ent)} .clave .l{color:var(--tx3)}

/* ── Leyenda ──────────────────────────────────────────────── */
.leyenda{
  display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;
  border-bottom:1px solid var(--linea);background:var(--bg2);font-size:11.5px;
}
.leyenda button{
  display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--linea);color:var(--tx2);transition:.15s;
}
.leyenda button:hover{border-color:var(--linea2);color:var(--tx)}
.leyenda button.off{opacity:.32}
.leyenda .sw{width:9px;height:9px;border-radius:3px}

/* ── Cuerpo ───────────────────────────────────────────────── */
main{display:flex;height:calc(100vh - 100px);position:relative}
#lienzo{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 22% 18%,color-mix(in srgb,var(--acento) 5%,transparent),transparent 55%),
  var(--bg);cursor:grab}
#lienzo.arrastrando{cursor:grabbing}
svg{width:100%;height:100%;display:block;touch-action:none}
.nodo{cursor:pointer}
.nodo rect.caja{
  fill:var(--panel);stroke:var(--linea2);stroke-width:1.2;
  transition:stroke .18s,filter .18s,fill .18s;
}
.nodo:hover rect.caja{stroke:var(--acento)}
.nodo.sel rect.caja{stroke:var(--acento);stroke-width:2.2}
.nodo text.tt{fill:var(--tx);font-size:11.5px;font-weight:600;pointer-events:none}
.nodo text.st{fill:var(--tx3);font-size:9.5px;pointer-events:none;letter-spacing:.3px;text-transform:uppercase}
.nodo rect.bar{stroke:none}
.nodo.apagado{opacity:.12}
#mundo.compacto .nodo text.st{display:none}
#mundo.compacto .nodo text.tt{font-size:13px}
.nodo.destacado rect.caja{stroke-width:2.4}
/* non-scaling-stroke: al alejar el zoom, un trazo de 1.1 px escalado a 0.3 se
   vuelve invisible y el grafo parece no tener conexiones. */
.arista{fill:none;stroke:var(--linea2);stroke-width:1.2;opacity:.55;
  vector-effect:non-scaling-stroke;transition:opacity .2s,stroke .2s}
.arista.apagada{opacity:.05}
.arista.destacada{stroke:var(--acento);stroke-width:2.2;opacity:1}
.nodo rect.caja{vector-effect:non-scaling-stroke}

/* ── Vecindad de un nodo ──────────────────────────────────── */
/* Dos colores, no uno: "de qué depende" y "quién depende de él" son preguntas
   distintas y en un grafo con aristas en ambos sentidos se confunden. */
.arista.sal{stroke:var(--sal);stroke-width:2.2;opacity:1}
.arista.ent{stroke:var(--ent);stroke-width:2.2;opacity:1}
.arista.lejana{stroke:var(--tx3);stroke-width:1.6;opacity:.75}
.nodo.foco rect.caja{stroke:var(--acento);stroke-width:2.8}
.nodo.vecino-sal rect.caja{stroke:var(--sal);stroke-width:2.2}
.nodo.vecino-ent rect.caja{stroke:var(--ent);stroke-width:2.2}
.nodo.vecino-amb rect.caja{stroke:var(--acento2);stroke-width:2.2}
.nodo.lejano rect.caja{stroke:var(--tx3);stroke-width:1.6}
.nodo.lejano{opacity:.72}
/* Vista previa al pasar el cursor: sin atenuar nada, solo levanta sus aristas. */
.arista.roce{stroke:var(--acento2);opacity:.95;stroke-width:1.9}
.et-capa{fill:var(--tx3);font-size:10.5px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;cursor:pointer}
.et-capa:hover{text-decoration:underline}
/* Relaciones que se quedan DENTRO del grupo: son su cohesión, no su frontera. */
.arista.interna{stroke:var(--tx2);stroke-width:1.6;opacity:.85;stroke-dasharray:5 3}
.banda{fill:currentColor;opacity:.028}
.paso-num{fill:#171000;font-size:10px;font-weight:800}

/* ── Tooltip ──────────────────────────────────────────────── */
#tip{
  position:fixed;pointer-events:none;z-index:90;max-width:320px;
  background:var(--panel);border:1px solid var(--linea2);border-radius:10px;
  padding:9px 11px;box-shadow:var(--sombra);display:none;font-size:12px;line-height:1.45;
}
#tip b{display:block;font-size:12.8px;margin-bottom:2px}
#tip .cap{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);margin-bottom:5px}
#tip p{margin:0;color:var(--tx2)}
#tip .met{margin-top:6px;padding-top:6px;border-top:1px solid var(--linea);color:var(--tx3);font-size:11px}

/* ── Panel derecho (Flows) ────────────────────────────────── */
aside{
  width:352px;flex:0 0 352px;background:var(--panel);border-left:1px solid var(--linea);
  display:flex;flex-direction:column;overflow:hidden;
}
aside.oculto{display:none}
.tabs{display:flex;border-bottom:1px solid var(--linea);flex:0 0 auto}
.tabs button{flex:1;padding:10px 6px;font-size:12.5px;color:var(--tx3);border-bottom:2px solid transparent}
.tabs button.on{color:var(--acento);border-bottom-color:var(--acento)}
.hoja{flex:1;overflow-y:auto;padding:10px}
.hoja.no{display:none}
.tit{
  font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);
  font-weight:700;margin:14px 4px 7px;
}
.tit:first-child{margin-top:2px}
.flujo{
  border:1px solid var(--linea);border-radius:var(--r);padding:9px 11px;margin-bottom:7px;
  cursor:pointer;transition:.15s;background:var(--panel2);
}
.flujo:hover{border-color:var(--linea2)}
.flujo.on{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 8%,var(--panel2))}
.flujo h3{margin:0 0 3px;font-size:13px;font-weight:620}
.flujo p{margin:0;font-size:11.8px;color:var(--tx2);line-height:1.42}
.flujo .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{
  font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--linea2);
  color:var(--tx3);white-space:nowrap;
}
.chip.ac{border-color:var(--acento);color:var(--acento)}
.chip.s{border-color:var(--sal);color:var(--sal)}
.chip.e{border-color:var(--ent);color:var(--ent)}

/* ── Tarjetas de grupo (módulos y capas) ──────────────────── */
.grupo{
  border:1px solid var(--linea);border-left:3px solid var(--cg,var(--linea2));
  border-radius:var(--r);padding:9px 11px;margin-bottom:7px;cursor:pointer;
  transition:.15s;background:var(--panel2);
}
.grupo:hover{border-color:var(--linea2);border-left-color:var(--cg,var(--linea2))}
.grupo.on{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 8%,var(--panel2))}
.grupo h3{margin:0 0 3px;font-size:13px;font-weight:620;display:flex;align-items:center;gap:7px}
.grupo h3 .sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.grupo p{margin:0;font-size:11.8px;color:var(--tx2);line-height:1.42}
.grupo .meta{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.grupo .rutas{
  margin-top:6px;font-size:10.5px;color:var(--tx3);line-height:1.5;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;word-break:break-all;
}
.grupo details{margin-top:7px}
.grupo summary{
  font-size:11px;color:var(--tx3);cursor:pointer;list-style:none;
  padding:3px 0;user-select:none;
}
.grupo summary::-webkit-details-marker{display:none}
.grupo summary::before{content:'▸ ';font-size:9px}
.grupo details[open] summary::before{content:'▾ '}
.grupo summary:hover{color:var(--tx)}

.pasos{border-top:1px solid var(--linea);padding:10px;max-height:46%;overflow-y:auto;flex:0 0 auto;background:var(--panel2)}
.pasos.no{display:none}
.paso{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--linea)}
.paso:last-child{border-bottom:0}
.paso .n{
  width:19px;height:19px;flex:0 0 auto;border-radius:50%;background:var(--acento);color:#171000;
  font-size:10.5px;font-weight:800;display:grid;place-items:center;margin-top:1px;cursor:pointer;
}
.paso .c{min-width:0}
.paso h4{margin:0 0 2px;font-size:12.3px;font-weight:600}
.paso p{margin:0;font-size:11.5px;color:var(--tx2);line-height:1.45}
.paso code{font-size:10.5px;color:var(--tx3);word-break:break-all;display:block;margin-top:3px}

/* ── Panel de información del nodo ────────────────────────── */
#info{
  position:absolute;top:0;left:0;bottom:0;width:400px;max-width:88vw;z-index:50;
  background:var(--panel);border-right:1px solid var(--linea);box-shadow:var(--sombra);
  transform:translateX(-102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
#info.abierto{transform:none}
.info-cab{padding:14px 16px;border-bottom:1px solid var(--linea);position:relative;flex:0 0 auto}
.info-cab .cerrar{position:absolute;top:11px;right:12px;font-size:19px;color:var(--tx3);line-height:1;padding:2px 6px}
.info-cab .cerrar:hover{color:var(--tx)}
.info-cab h2{margin:6px 0 4px;font-size:16px;font-weight:660;padding-right:26px;line-height:1.3}
.info-cab .tipo{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.info-cab p{margin:6px 0 0;font-size:12.5px;color:var(--tx2);line-height:1.5}
.info-cuerpo{flex:1;overflow-y:auto;padding:12px 16px 24px}
.sec{margin-bottom:15px}
.sec>h5{
  margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--tx3);font-weight:700;
}
.sec p{margin:0;font-size:12.5px;color:var(--tx2);line-height:1.5}
.lista{display:flex;flex-direction:column;gap:3px}
.lista code{
  font-size:11px;color:var(--tx2);background:var(--panel2);border:1px solid var(--linea);
  border-radius:6px;padding:3px 7px;word-break:break-all;font-family:ui-monospace,"SF Mono",Menlo,monospace;
}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.enl{
  display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;cursor:pointer;
  font-size:12.2px;color:var(--tx2);border:1px solid transparent;
}
.enl:hover{background:var(--panel2);border-color:var(--linea);color:var(--tx)}
.enl .fl{color:var(--tx3);font-size:10.5px;margin-left:auto;text-align:right;max-width:44%}

/* ── Controles flotantes ──────────────────────────────────── */
.zoom{
  position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column;gap:5px;z-index:30;
}
.zoom button{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--linea);background:var(--panel);
  color:var(--tx2);font-size:15px;display:grid;place-items:center;box-shadow:var(--sombra);
}
.zoom button:hover{color:var(--tx);border-color:var(--linea2)}
.aviso{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;
  background:var(--panel);border:1px solid var(--linea);border-radius:20px;
  padding:6px 14px;font-size:11.5px;color:var(--tx3);box-shadow:var(--sombra);
  pointer-events:none;opacity:0;transition:opacity .3s;
}
.aviso.ver{opacity:1}

@media (max-width:1080px){
  aside{width:300px;flex-basis:300px}
}
@media (max-width:820px){
  main{flex-direction:column;height:calc(100vh - 128px)}
  aside{width:100%;flex:0 0 46%;border-left:0;border-top:1px solid var(--linea)}
  #lienzo{flex:1 1 54%}
  #info{width:100%}
  .leyenda{overflow-x:auto;flex-wrap:nowrap}
}
</style>
</head>
<body>

<header>
  <div class="marca">
    <div class="logo">S</div>
    <div>
      <h1 id="h-nombre">SPACE OS</h1>
      <span id="h-sub">Arquitectura y flujos</span>
    </div>
  </div>

  <div class="buscador">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar nodo, archivo, API, tabla, flujo…" autocomplete="off">
    <div class="sugerencias" id="sug"></div>
  </div>

  <div class="acciones">
    <div class="salto" id="salto" title="Cuántos saltos de distancia se iluminan alrededor del nodo elegido">
      <span>Relación</span>
      <button data-p="1" class="on">1</button>
      <button data-p="2">2</button>
      <button data-p="99">Todo</button>
    </div>
    <button class="btn" id="b-reacomodar" title="Recalcular posiciones">Reacomodar</button>
    <button class="btn" id="b-ajustar" title="Encajar todo en pantalla">Ajustar</button>
    <button class="btn" id="b-limpiar" title="Quitar el resaltado del flujo">Limpiar</button>
    <button class="btn" id="b-panel" title="Mostrar u ocultar el panel">Panel</button>
    <button class="btn" id="b-tema" title="Claro / oscuro">◐</button>
  </div>
</header>

<div class="leyenda" id="leyenda"></div>

<main>
  <div id="lienzo">
    <svg id="svg">
      <defs>
        <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 10 5 0 10z" fill="var(--linea2)"/>
        </marker>
        <marker id="pf-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 10 5 0 10z" fill="var(--acento)"/>
        </marker>
        <marker id="pf-sal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 10 5 0 10z" fill="var(--sal)"/>
        </marker>
        <marker id="pf-ent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 10 5 0 10z" fill="var(--ent)"/>
        </marker>
      </defs>
      <g id="mundo">
        <g id="g-bandas"></g>
        <g id="g-aristas"></g>
        <g id="g-nodos"></g>
      </g>
    </svg>

    <div class="zoom">
      <button id="z-mas">+</button>
      <button id="z-menos">−</button>
      <button id="z-reset" title="Restablecer" style="font-size:12px">⤢</button>
    </div>
    <div class="aviso" id="aviso"></div>

    <div id="info">
      <div class="info-cab">
        <button class="cerrar" id="i-cerrar">×</button>
        <div class="tipo" id="i-tipo"></div>
        <h2 id="i-nombre"></h2>
        <p id="i-desc"></p>
      </div>
      <div class="info-cuerpo" id="i-cuerpo"></div>
    </div>
  </div>

  <aside id="aside">
    <div class="tabs">
      <button class="on" data-h="flujos">Flujos</button>
      <button data-h="capas">Grupos</button>
      <button data-h="catalogo">Catálogo</button>
    </div>
    <div class="hoja" id="h-flujos"></div>
    <div class="hoja no" id="h-capas"></div>
    <div class="hoja no" id="h-catalogo"></div>
    <div class="pasos no" id="pasos"></div>
  </aside>

r, la hidratación del estado y el sondeo de notificaciones.","archivo":"apps/web/app/(app)/(shell)/layout.tsx"}]},{"id":"flow-signup","nombre":"Alta de organización (autorregistro)","categoria":"Autenticación","descripcion":"Creación de un CRM nuevo desde la pantalla de login: organización + usuario Dueño, sin verificación de correo.","objetivo":"Que alguien pueda empezar a usar el producto sin intervención manual.","resultado":"Fila nueva en tenants, usuario con rol DUENO ligado a ella y sesión iniciada.","componentes":["ui-login","api-signup","infra-ratelimit","ctrl-cuentas","infra-tenant","repo-usuarios","infra-auth","db-identidad"],"archivos":["apps/web/app/(app)/login/page.tsx","apps/web/app/api/signup/route.ts","apps/web/lib/server/cuentas-controller.ts","apps/web/lib/server/tenant.ts","apps/web/lib/server/db.ts"],"apis":["POST /api/signup"],"consultas":["insert into tenants (nombre, slug) values ($1,$2) returning …","qConTenant(tenantId, 'insert into usuarios …')"],"validaciones":["Bandera NEXT_PUBLIC_AUTOREGISTRO comprobada en el cliente Y en el servidor","Límite de intentos por IP","Política de contraseña: 8+, una letra, un número, sin espacios","Correo único (auth_email_existe)","Slug con sufijo automático si choca"],"pasos":[{"n":1,"nodo":"ui-login","titulo":"Formulario de crear cuenta","detalle":"Solo se muestra si NEXT_PUBLIC_AUTOREGISTRO no vale '0'. Apagar solo la UI dejaría el endpoint abierto, así que el servidor lo comprueba también.","archivo":"apps/web/app/(app)/login/page.tsx"},{"n":2,"nodo":"api-signup","titulo":"POST /api/signup","detalle":"Ruta exenta de CSRF (no hay sesión que proteger) pero con límite de intentos por IP.","archivo":"apps/web/app/api/signup/route.ts"},{"n":3,"nodo":"ctrl-cuentas","titulo":"Validar y hashear","detalle":"registrarCuentaCtrl valida nombre, correo y contraseña con zod y la política de contraseñas, y hashea con bcrypt.","archivo":"apps/web/lib/server/cuentas-controller.ts"},{"n":4,"nodo":"infra-tenant","titulo":" o","Token de un solo uso, vence en 1 hora","Política de contraseña al fijar la nueva","emailHabilitado() exige RESEND_API_KEY Y EMAIL_FROM: con la bandera encendida pero EMAIL_FROM vacío el usuario ve «revisa tu bandeja» y no le llega nada"],"pasos":[{"n":1,"nodo":"ui-login","titulo":"¿Olvidaste tu contraseña?","detalle":"POST /api/auth/forgot con el correo. La bandera NEXT_PUBLIC_RECUPERAR_PASSWORD controla si el enlace se muestra.","archivo":"apps/web/app/(app)/login/page.tsx"},{"n":2,"nodo":"repo-varios","titulo":"Crear el token","detalle":"crearReset() genera un token aleatorio, lo guarda con expiración a una hora y lo asocia al usuario.","archivo":"apps/web/lib/server/password-reset-repo.ts"},{"n":3,"nodo":"infra-email","titulo":"Enviar el correo","detalle":"htmlCorreoReset arma la plantilla y enviarEmail hace POST a la API de Resend. Si el correo no está configurado, en desarrollo el enlace se imprime en el log.","archivo":"apps/web/lib/server/email.ts"},{"n":4,"nodo":"ui-recuperar","titulo":"El usuario abre el enlace","detalle":"/recuperar/[token] llama GET /api/auth/reset?token=… para comprobar que el token sigue vivo antes de mostrar el formulario.","archivo":"apps/web/app/(app)/recuperar/[token]/page.tsx"},{"n":5,"nodo":"db-identidad","titulo":"Consumir el token","detalle":"consumirReset() valida, actualiza password_hash, marca el token como usado y BORRA las sesiones del usuario: si alguien había secuestrado una, muere aquí.","archivo":"apps/web/lib/server/password-reset-repo.ts"}]},{"id":"flow-hidratacion","nombre":"Hidratación del estado (GET /api/estado)","categoria":"Datos","descripcion":"El endpoint que llena de una sola vez el store del navegador con las 23 rebanadas del negocio, filtradas por los permisos del rol.","objetivo":"Que todas las pantallas trabajen sobre el mismo estado en memoria y se repinten solas al mutar.","resultado":"Store zustand poblado; los hooks de lectura devuelven datos y las derivaciones calculan KPIs, pipeline y alertas si o/arrendadores/ConciliacionCard.tsx","apps/web/app/api/pagos-renta/[id]/pagar/route.ts","apps/web/app/api/pagos-renta/[id]/adjunto/[tipo]/route.ts","apps/web/lib/server/arrendadores-repo.ts","apps/web/lib/renta-periodicidad.ts"],"apis":["PATCH /api/pagos-renta/[id]","POST /api/pagos-renta/[id]/pagar","GET /api/pagos-renta/[id]/adjunto/[tipo]"],"consultas":["insert into pagos_renta … (una fila por periodo, anclada al inicio del contrato)","update pagos_renta set estatus='PAGADO', pagado_en=$2, comprobante_url=$3","select … from pagos_renta where estatus='VENCIDO'"],"validaciones":["ADR 0004: la periodicidad admite hasta pago diario","ADR 0005: los recordatorios son proporcionales a la cadencia — no se avisa igual de un pago semanal que de uno anual","ADR 0007: los vencimientos se anclan al inicio del contrato","Los meses cortos se ajustan (migración 20260731_calendario_meses_cortos)","Adjuntos: PDF o imagen, 5 MB máximo","Pagar exige el control de cambios; cambiar los DATOS BANCARIOS del arrendador lo exige en modo ESTRICTO, sin exención ni para el Dueño"],"pasos":[{"n":1,"nodo":"repo-arrendadores","titulo":"El calendario ya existe","detalle":"Se generó al crear el contrato: una fila de pagos_renta por periodo, con su vencimiento calculado.","archivo":"apps/web/lib/server/arrendadores-repo.ts"},{"n":2,"nodo":"job-barridos-estado","titulo":"Recomputar estatus","detalle":"recomputarEstatusArrendadores() sincroniza contratos y pagos con la fecha de hoy (vigente / por vencer a 3 meses / vencido) para que el P&L y las alertas no usen un estatus congelado.","archivo":"apps/web/lib/server/arrendadores-repo.ts"},{"n":3,"nodo":"infra-cambios","titulo":"Candado","detalle":"Registrar el pago pasa por exigirCambioSensible. Los datos bancarios usan sinExenciones: una sesión de Dueño desatendida no debe poder redirigir pagos sin reautenticar.","archivo":"apps/web/lib/server/cambios.ts"},{"n":4,"nodo":"infra-uploads","titulo":"Adjuntar comprobante","detalle":"Comprobante y factura, o) y contador en la campanita.","componentes":["shell-layout","job-sondeo","api-notificaciones","repo-notificaciones","db-sistema","shell-chrome","carga-global"],"archivos":["apps/web/components/demo/shell/SondeoNotificaciones.tsx","apps/web/app/api/notificaciones/nuevas/route.ts","apps/web/lib/server/notificaciones-repo.ts","apps/web/lib/carga-global.ts"],"apis":["GET /api/notificaciones/nuevas?sondeo=1&desde=…","POST /api/notificaciones/[id]/leer","POST /api/notificaciones/leer-todas"],"consultas":["select … from notificaciones where tenant_id=$1 and creado_en > $2 order by creado_en","update notificaciones set leida=true where id=$1"],"validaciones":["Se PARA cuando la pestaña no está visible: sin esto, veinte pestañas olvidadas seguirían consultando toda la noche","Al volver a la pestaña consulta de inmediato, sin esperar al siguiente ciclo","La petición va marcada como de fondo (sondeo=1) para no encender la barra de carga","La marca de inicio es «ahora»: avisar de todo el histórico al abrir sería ruido"],"pasos":[{"n":1,"nodo":"job-sondeo","titulo":"Ciclo de 15 segundos","detalle":"Se hace por sondeo y no por WebSocket a propósito: son eventos de negocio, no un chat. Unos segundos de demora no cambian nada, y una conexión permanente por usuario habría que mantenerla viva y reconectarla en cada reinicio.","archivo":"apps/web/components/demo/shell/SondeoNotificaciones.tsx"},{"n":2,"nodo":"api-notificaciones","titulo":"Consulta incremental","detalle":"notificacionesDesde(marca) devuelve solo lo nuevo desde la última vista.","archivo":"apps/web/app/api/notificaciones/nuevas/route.ts"},{"n":3,"nodo":"shell-chrome","titulo":"Aviso emergente y campanita","detalle":"El nivel decide el estilo del toast (sonner). El contador de la campanita se actualiza y desde ahí se marcan como leídas.","archivo":"apps/web/components/demo/shell/Topbar.tsx"}]},{"id":"flow-portal-cliente","nombre":"Portal público de campaña","categoria":"Público","descripcion":"Vista de seguimiento para ord_hash y NUNCA viaja al cliente, ni siquiera el hash","El desbloqueo vive en el SERVIDOR (sesiones.desbloqueo_expira_en); en el navegador cualquiera se lo inventaría con las herramientas de desarrollo","Rotar la contraseña cierra todos los desbloqueos vivos del tenant","Modo estricto (sinExenciones) para datos bancarios: ni el Dueño está exento","Límite de intentos en el desbloqueo"],"pasos":[{"n":1,"nodo":"ui-administracion","titulo":"El Dueño fija la contraseña","detalle":"ControlCambiosPanel llama PUT /api/cambios. La política de contraseñas es la misma del login.","archivo":"apps/web/components/demo/admin/ControlCambiosPanel.tsx"},{"n":2,"nodo":"infra-cambios","titulo":"Guard en la ruta sensible","detalle":"exigirCambioSensible(modulo, accion) corre exigir() primero (permiso del rol) y luego exigirDesbloqueo(). Deja pasar si es el Dueño, si el control está apagado, o si la sesión está desbloqueada y no expiró.","archivo":"apps/web/lib/server/cambios.ts"},{"n":3,"nodo":"shell-chrome","titulo":"403 con requiereDesbloqueo","detalle":"La respuesta lleva requiereDesbloqueo:true para que la UI abra el modal de contraseña en vez de enseñar un error rojo.","archivo":"apps/web/components/demo/shell/DesbloqueoCambios.tsx"},{"n":4,"nodo":"db-identidad","titulo":"Desbloquear 15 minutos","detalle":"Se compara con bcrypt en el servidor y se escribe desbloqueo_expira_en en la fila de la sesión. Suficiente para una tanda de correcciones, corto para que un equipo dejado a medias no quede abierto toda la tarde.","archivo":"apps/web/lib/server/cambios.ts"}]},{"id":"flow-multitenant","nombre":"Aislamiento multi-tenant (RLS)","categoria":"Seguridad","descripcion":"Cómo se decide de qué organización son los datos de cada petición y por qué un olvido no filtra información.","objetivo":"Que dos organizaciones sobre la misma base no puedan verse nunca.","resultado":"Cada consulta corre con app.tenant_id fijado transaction-local y las políticas RLS fail-closed acotan las filas.","componentes":["middleware","infra-auth","infra-tenant","infra-db","db-rls","db-funciones","db-postgres","api-tenants"],"archivos":["apps/web/lib/server/db.ts","apps/web/lib/server/tenant.ts","apps/web/lib/server/auth.ts","db/migrations/20260720_hard1_rls_todas_tablas.sql","db/migrations/20260715_arr_m5_rls_failclosed.sql","db/migrations/20260720_hard1_usuarios_rls.sql"],"apis":["POST /api/tenant-activo","GET /api/tenants"],"consultas":["select set_config('app.tenant_id', $1, true)","create policy … using (tenant_id = current_setting('app.tenant_id', true)::uuid)","select id from tenants order by creado_en asc limit 1"],"validaciones":["El GUC se fija TRANSACTION-local (tercer parámetro true), nunca a nivel de sesión: el pool reusa conexiones entre tenants y un GUC de sesión filtraría datos de otro","Fail-closed: sin GUC no se ve nada, así que un handler que olvide fijar el tenant devuelve cero filas en vez de datos ajenos","Las tablas de bootstrap (tenants, usuarios, sesiones) están exentas y se leen con qRaw, porque el tenant es justo lo que se está resolviendo","El override por cookie de CRM SOLO se acepta del Dueño del tenant más antiguo, y el id se comprueba contra la tabla antes de usarlo"],"pasos":[{"n":1,"nodo":"infra-auth","titulo":"Cookie → usuario","detalle":"usuarioActual() lee spaces_sesion y resuelve al usuario por auth_usuario_por_sesion($1), función SECURITY DEFINER acotada.","archivo":"apps/web/lib/server/auth.ts"},{"n":2,"nodo":"infra-tenant","titulo":"Usuario → tenant activo","detalle":"tenantActual() devuelve el tenant del usuario, salvo que haya override por cookie y quien lo pide sea el super-admin de la plataforma. Memoizado por petición con cache() de React.","archivo":"apps/web/lib/server/tenant.ts"},{"n":3,"nodo":"infra-db","titulo":"Fijar el GUC","detalle":"q() abre transacción, hace set_config('app.tenant_id', tenant, true), ejecuta y hace commit. withTenantTx() hace lo mismo para operaciones de varias sentencias.","archivo":"apps/web/lib/server/db.ts"},{"n":4,"nodo":"db-rls","titulo":"Las políticas acotan","detalle":"Cada tabla del negocio compara tenant_id contra el GUC. usuarios lleva además FORCE, que aplica la política incluso al dueño de la tabla.","archivo":"db/migrations/20260720_hard1_rls_todas_tablas.sql"},{"n":5,"nodo":"db-funciones","titulo":"Rutas públicas","detalle":"Portal, propuesta pública y firma resuelven su tenant desde el TOKEN con funciones SECURITY DEFINER, y luego usan fijarTenantExplicito(). El id nunca viene del cliente.","archivo":"apps/web/lib/server/db.ts"}],"riesgos":["21 tablas conservan un DEFAULT de tenant_id apuntando a un tenant concreto que no está en el repositorio; conviene revisarlo antes de dar de alta organizaciones nuevas."]},{"id":"flow-csrf","nombre":"Defensa CSRF (double-submit)","categoria":"Seguridad","descripcion":"Toda mutación autenticada por cookie debe traer el token en la cabecera y coincidir con la cookie.","objetivo":"Que un sitio atacante no pueda ejecutar acciones en nombre del usuario aprovechando su cookie.","resultado":"Mutación aceptada solo si cookie y cabecera coinciden; si no, 403 antes de llegar al handler.","componentes":["middleware","infra-auth","estado-api","sitios-api-cli","apis-cliente-varios"],"archivos":["apps/web/middleware.ts","apps/web/lib/server/auth.ts","apps/web/lib/csrf-client.ts"],"apis":["Todas las mutaciones POST/PUT/PATCH/DELETE de /api/*"],"consultas":[],"validaciones":["Exentos: login, forgot, reset, signup, logout, /api/portal/*, /api/firma/* y /api/propuestas/publica/* — ninguno depende de la cookie de sesión","Si NO hay cookie de sesión no hay credencial ambiental que proteger, y se deja pasar","La cookie CSRF es httpOnly:false a propósito: el front debe poder leerla. Un sitio atacante no puede leerla (política de mismo origen) ni fijar la cabecera cross-site","sameSite: lax se mantiene como primera capa"],"pasos":[{"n":1,"nodo":"infra-auth","titulo":"Emitir el par","detalle":"Al iniciar sesión se emiten spaces_sesion on":"cookie de sesión","idempotencia":"consulta incremental por marca de tiempo","salida":"avisos emergentes y contador de la campanita"}],"files":[{"ruta":"apps/web/middleware.ts","nodo":"middleware","rol":"CSRF, compuerta de sesión, redirecciones y ruteo por subdominio"},{"ruta":"apps/web/next.config.mjs","nodo":"next-config","rol":"basePath, cabeceras de seguridad, alias de styled-jsx"},{"ruta":"apps/web/lib/server/db.ts","nodo":"infra-db","rol":"pool de Postgres y contexto de tenant transaction-local"},{"ruta":"apps/web/lib/server/auth.ts","nodo":"infra-auth","rol":"contraseñas, sesiones, cookies y permisos"},{"ruta":"apps/web/lib/server/tenant.ts","nodo":"infra-tenant","rol":"resolución del tenant activo y super-admin de plataforma"},{"ruta":"apps/web/lib/server/cambios.ts","nodo":"infra-cambios","rol":"control de cambios con desbloqueo por 15 minutos"},{"ruta":"apps/web/lib/server/errores.ts","nodo":"infra-errores","rol":"AppError, validación zod en español y mapeo de códigos de Postgres"},{"ruta":"apps/web/lib/server/uploads.ts","nodo":"infra-uploads","rol":"validación de subidas por magic bytes y saneo de SVG"},{"ruta":"apps/web/lib/server/campanas-repo.ts","nodo":"repo-campanas","rol":"reserva transaccional, propuesta→campaña, validación de publicación"},{"ruta":"apps/web/lib/server/arrendadores-repo.ts","nodo":"repo-arrendadores","rol":"contratos, calendario de renta y recomputación de estatus"},{"ruta":"apps/web/lib/server/contratos-sitio.ts","nodo":"repo-contratos-sitio","rol":"invariantes de pantalla ↔ predio ↔ contrato (ADR 0001-0003)"},{"ruta":"apps/web/lib/server/firmas-repo.ts","nodo":"repo-firmas","rol":"congelado del documento, hash y firma por token"},{"ruta":"apps/web/lib/server/doohmain.ts","nodo":"infra-doohmain","rol":"puente por subproceso al SDK de DOOHmain"},{"ruta":"apps/web/lib/server/space-eye.ts","nodo":"infra-spaceeye","rol":"cliente REST+JWT de las cámaras de verificación"},{"ruta":"apps/web/lib/data/derive.ts","nodo":"derive","rol":"1500 líneas de reglas de negocio puras y probadas"},{"ruta":"apps/web/lib/data/estado-api.ts","nodo":"estado-api","rol":"~35 mutaciones contra el BFF con rehidratación"},{"ruta":"apps/web/lib/data/store.ts","nodo":"store","rol":"store zustand, única fuente de verdad del cliente"},{"ruta":"apps/web/app/api/estado/route.ts","nodo":"api-estado","rol":"hidratación con filtrado por permisos y barridos"},{"ruta":"apps/web/app/api/recordatorios/route.ts","nodo":"job-recordatorios","rol":"cron diario multi-tenant"},{"ruta":"apps/web/components/demo/shell/nav.ts","nodo":"authgate","rol":"fuente única de menú y autorización por ruta"},{"ruta":"db/schema.sql","nodo":"db-postgres","rol":"esquema base con enums y 27 tablas"},{"ruta":"db/migrations/","nodo":"db-postgres","rol":"54 migraciones versionadas (RLS, contratos, parcialidades, firmas)"},{"ruta":"doohmain_sdk/","nodo":"ext-doohmain-sdk","rol":"SDK Python con primitivas idempotentes"},{"ruta":"docs/adr/","nodo":"devops-adr","rol":"ocho decisiones de arquitectura implementadas"},{"ruta":"infra/scripts/","nodo":"devops-deploy","rol":"despliegue, aprovisionamiento y alta de tenants"},{"ruta":".github/workflows/ci.yml","nodo":"devops-ci","rol":"typecheck, pruebas y build en cada PR"},{"ruta":"_archive/","nodo":"devops-archivo","rol":"backend Fastify y segundo frontend retirados — NO desplegados"}]}</script>
<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById('arch-data').textContent);
const $ = s => document.querySelector(s);
const cre = (t,c) => { const e=document.createElementNS('http://www.w3.org/2000/svg',t); if(c) e.setAttribute('class',c); return e; };
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ── Índices ─────────────────────────────────────────────── */
const N = new Map(D.nodes.map(n => [n.id, n]));
const CAPAS = D.project.capas;
const iCapa = new Map(CAPAS.map((c,i) => [c.id, i]));
const colorCapa = id => `var(--c-${id})`;
const salidas = new Map(), entradas = new Map();
D.nodes.forEach(n => { salidas.set(n.id,[]); entradas.set(n.id,[]); });
const E = D.edges.filter(e => N.has(e.from) && N.has(e.to));
E.forEach(e => { salidas.get(e.from).push(e); entradas.get(e.to).push(e); });

/* ── Geometría ───────────────────────────────────────────── */
const AN=212, AL=54, GAPX=88, GAPY=20, MAXFIL=22, SUBGAP=26;
let roceId = null;
const pos = new Map();            // id -> {x,y}
const capasBox = [];              // {id,nombre,x,w,y0,y1}

function calcularLayout(){
  capasBox.length = 0;
  const porCapa = CAPAS.map(c => D.nodes.filter(n => n.capa === c.id));
  // orden inicial estable: por número de conexiones, descendente
  porCapa.forEach(g => g.sort((a,b) =>
    (salidas.get(b.id).length+entradas.get(b.id).length) - (salidas.get(a.id).length+entradas.get(a.id).length)
    || a.nombre.localeCompare(b.nombre)));

  // 8 pasadas de baricentro para reducir cruces
  const idx = new Map();
  const reindexar = () => porCapa.forEach(g => g.forEach((n,i) => idx.set(n.id,i)));
  reindexar();
  for(let it=0; it<8; it++){
    const dir = it%2===0;
    const rango = dir ? [...porCapa.keys()] : [...porCapa.keys()].reverse();
    for(const li of rango){
      const g = porCapa[li]; if(g.length<2) continue;
      const bc = new Map();
      for(const n of g){
        const vec = (dir ? entradas.get(n.id).map(e=>e.from) : salidas.get(n.id).map(e=>e.to))
          .filter(v => N.has(v) && idx.has(v));
        bc.set(n.id, vec.length ? vec.reduce((s,v)=>s+idx.get(v),0)/vec.length : idx.get(n.id));
      }
      g.sort((a,b) => bc.get(a.id)-bc.get(b.id) || a.nombre.localeCompare(b.nombre));
      reindexar();
    }
  }

  let x = 60;
  porCapa.forEach((g,li) => {
    const subs = Math.max(1, Math.ceil(g.length/MAXFIL));
    const filas = Math.ceil(g.length/subs);
    const w = subs*AN + (subs-1)*SUBGAP;
    g.forEach((n,i) => {
      const col = Math.floor(i/filas), fil = i%filas;
      pos.set(n.id, { x: x + col*(AN+SUBGAP), y: 74 + fil*(AL+GAPY) });
    });
    capasBox.push({ id:CAPAS[li].id, nombre:CAPAS[li].nombre, x, w, alto: 74 + filas*(AL+GAPY) });
    x += w + GAPX;
  });
}

/* ── Dibujo ──────────────────────────────────────────────── */
const gB=$('#g-bandas'), gA=$('#g-aristas'), gN=$('#g-nodos');
const elNodo = new Map(), elArista = [];

function ruta(a,b){
  const x1=a.x+AN, y1=a.y+AL/2, x2=b.x, y2=b.y+AL/2;
  if(x2 >= x1-6){
    const d = Math.max(40, (x2-x1)*0.5);
    return `M${x1},${y1} C${x1+d},${y1} ${x2-d},${y2} ${x2},${y2}`;
  }
  // arista hacia atrás: sale por abajo y vuelve
  const yb = Math.max(y1,y2) + 46 + Math.abs(y1-y2)*0.15;
  return `M${x1},${y1} C${x1+70},${yb} ${x2-70},${yb} ${x2},${y2}`;
}

function dibujar(){
  gB.textContent=''; gA.textContent=''; gN.textContent='';
  elNodo.clear(); elArista.length=0; roceId = null;

  const altoMax = Math.max(...capasBox.map(c=>c.alto), 400);
  capasBox.forEach(c => {
    const r = cre('rect','banda');
    r.setAttribute('x', c.x-22); r.setAttribute('y', 34);
    r.setAttribute('width', c.w+44); r.setAttribute('height', altoMax+16);
    r.setAttribute('rx', 16); r.style.color = colorCapa(c.id);
    gB.appendChild(r);
    const t = cre('text','et-capa');
    t.setAttribute('x', c.x); t.setAttribute('y', 56);
    t.style.fill = colorCapa(c.id); t.textContent = c.nombre.toUpperCase();
    // El rótulo de la capa es el modo más directo de iluminarla entera.
    t.onclick = () => grupoDeCapa(c.id);
    gB.appendChild(t);
  });

  E.forEach(e => {
    const p = cre('path','arista');
    p.setAttribute('d', ruta(pos.get(e.from), pos.get(e.to)));
    p.setAttribute('marker-end','url(#pf)');
    gA.appendChild(p);
    elArista.push({ e, el:p });
  });

  D.nodes.forEach(n => {
    const p = pos.get(n.id); if(!p) return;
    const g = cre('g','nodo');
    g.setAttribute('transform',`translate(${p.x},${p.y})`);
    g.dataset.id = n.id;

    const caja = cre('rect','caja');
    caja.setAttribute('width',AN); caja.setAttribute('height',AL); caja.setAttribute('rx',9);
    g.appendChild(caja);

    const bar = cre('rect','bar');
    bar.setAttribute('x',0); bar.setAttribute('y',0);
    bar.setAttribute('width',4); bar.setAttribute('height',AL);
    bar.setAttribute('rx',2); bar.style.fill = colorCapa(n.capa);
    g.appendChild(bar);

    const st = cre('text','st');
    st.setAttribute('x',14); st.setAttribute('y',18);
    st.style.fill = colorCapa(n.capa);
    st.textContent = String(n.tipo||'').slice(0,22);
    g.appendChild(st);

    const tt = cre('text','tt');
    tt.setAttribute('x',14); tt.setAttribute('y',36);
    tt.textContent = recortar(n.nombre, 27);
    g.appendChild(tt);

    const bad = cre('text','st');
    bad.setAttribute('x',AN-12); bad.setAttribute('y',36);
    bad.setAttribute('text-anchor','end');
    bad.textContent = `${salidas.get(n.id).length}↗ ${entradas.get(n.id).length}↙`;
    g.appendChild(bad);

    const num = cre('g'); num.setAttribute('class','n-paso'); num.style.display='none';
    const nc = cre('circle'); nc.setAttribute('cx',AN-16); nc.setAttribute('cy',14);
    nc.setAttribute('r',9); nc.style.fill='var(--acento)';
    const nt = cre('text','paso-num'); nt.setAttribute('x',AN-16); nt.setAttribute('y',17.5);
    nt.setAttribute('text-anchor','middle');
    num.appendChild(nc); num.appendChild(nt);
    g.appendChild(num);

    gN.appendChild(g);
    elNodo.set(n.id, { g, caja, num, numTx:nt });
  });
}
function recortar(s,n){ return s.length>n ? s.slice(0,n-1)+'…' : s; }

function refrescarAristas(){
  elArista.forEach(({e,el}) => el.setAttribute('d', ruta(pos.get(e.from), pos.get(e.to))));
}

/* ── Zoom y desplazamiento ───────────────────────────────── */
let vx=0, vy=0, vk=1;
const mundo = $('#mundo'), lienzo = $('#lienzo');
const aplicar = () => {
  mundo.setAttribute('transform',`translate(${vx},${vy}) scale(${vk})`);
  // Muy alejado, el texto secundario es ruido ilegible: se oculta y quedan las
  // cajas de color, que es lo único que se distingue a esa escala.
  mundo.classList.toggle('compacto', vk < 0.42);
};

function ajustar(pad=70){
  const r = lienzo.getBoundingClientRect();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pos.forEach(p => { x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x+AN); y1=Math.max(y1,p.y+AL); });
  y0 -= 40;
  const k = Math.min((r.width-pad*2)/(x1-x0), (r.height-pad*2)/(y1-y0), 1.5);
  vk = Math.max(0.08, k);
  vx = pad + (r.width-pad*2 - (x1-x0)*vk)/2 - x0*vk;
  vy = pad + (r.height-pad*2 - (y1-y0)*vk)/2 - y0*vk;
  aplicar();
}
function centrarEn(id, k){
  const p = pos.get(id); if(!p) return;
  const r = lienzo.getBoundingClientRect();
  vk = k ?? Math.max(vk, .85);
  vx = r.width/2 - (p.x+AN/2)*vk;
  vy = r.height/2 - (p.y+AL/2)*vk;
  aplicar();
}

lienzo.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = lienzo.getBoundingClientRect();
  const mx = ev.clientX-r.left, my = ev.clientY-r.top;
  const f = Math.exp(-ev.deltaY*0.0016);
  const k2 = Math.min(2.6, Math.max(0.06, vk*f));
  vx = mx - (mx-vx)*(k2/vk); vy = my - (my-vy)*(k2/vk); vk = k2;
  aplicar();
}, {passive:false});

let arr=null;
lienzo.addEventListener('pointerdown', ev => {
  const g = ev.target.closest('.nodo');
  if(g){
    const id = g.dataset.id;
    arr = { tipo:'nodo', id, x0:ev.clientX, y0:ev.clientY, px:pos.get(id).x, py:pos.get(id).y, movido:false };
  } else {
    arr = { tipo:'fondo', x0:ev.clientX, y0:ev.clientY, vx0:vx, vy0:vy };
    lienzo.classList.add('arrastrando');
  }
  lienzo.setPointerCapture(ev.pointerId);
});
lienzo.addEventListener('pointermove', ev => {
  if(!arr) { return; }
  const dx = ev.clientX-arr.x0, dy = ev.clientY-arr.y0;
  if(arr.tipo==='fondo'){ vx=arr.vx0+dx; vy=arr.vy0+dy; aplicar(); }
  else {
    if(Math.abs(dx)+Math.abs(dy) > 3) arr.movido = true;
    const p = pos.get(arr.id);
    p.x = arr.px + dx/vk; p.y = arr.py + dy/vk;
    elNodo.get(arr.id).g.setAttribute('transform',`translate(${p.x},${p.y})`);
    refrescarAristas();
  }
});
const soltar = ev => {
  if(arr && arr.tipo==='nodo' && !arr.movido) abrirInfo(arr.id);
  arr=null; lienzo.classList.remove('arrastrando');
};
lienzo.addEventListener('pointerup', soltar);
lienzo.addEventListener('pointercancel', soltar);

/* ── Tooltip ─────────────────────────────────────────────── */
const tip = $('#tip');
// Vista previa al pasar el cursor: levanta las aristas del nodo bajo el ratón
// sin atenuar nada. Solo cuando no hay ya un resaltado, para no pisar sus colores.
function roce(id){
  if(roceId === id) return;
  roceId = id;
  const libre = !flujoActivo && !hayFoco();
  elArista.forEach(({e, el}) =>
    el.classList.toggle('roce', libre && id !== null && (e.from === id || e.to === id)));
}
lienzo.addEventListener('mousemove', ev => {
  const g = ev.target.closest('.nodo');
  roce(g ? g.dataset.id : null);
  if(!g){ tip.style.display='none'; return; }
  const n = N.get(g.dataset.id);
  const cap = CAPAS.find(c=>c.id===n.capa);
  tip.innerHTML =
    `<div class="cap" style="color:${colorCapa(n.capa)}">${esc(cap?cap.nombre:n.capa)} · ${esc(n.tipo)}</div>`+
    `<b>${esc(n.nombre)}</b><p>${esc(recortar(n.descripcion,190))}</p>`+
    `<div class="met">${salidas.get(n.id).length} dependencias · ${entradas.get(n.id).length} dependientes`+
    (n.archivos&&n.archivos.length?` · ${n.archivos.length} archivos`:'')+`</div>`;
  tip.style.display='block';
  const r = tip.getBoundingClientRect();
  let x = ev.clientX+14, y = ev.clientY+14;
  if(x+r.width > innerWidth-8) x = ev.clientX-r.width-14;
  if(y+r.height > innerHeight-8) y = ev.clientY-r.height-14;
  tip.style.left = x+'px'; tip.style.top = y+'px';
});
lienzo.addEventListener('mouseleave', ()=> { tip.style.display='none'; roce(null); });

/* ── Resaltado ───────────────────────────────────────────── */
// Un solo estado: o hay un flujo iluminado, o hay la vecindad de un nodo. Los dos
// pintan sobre las mismas clases, así que compartir el limpiado evita que queden
// restos de uno cuando entra el otro.
let flujoActivo = null, nodoSel = null, salto = 1;
let focoSemillas = null, focoEtiqueta = null;
const hayFoco = () => !!(focoSemillas && focoSemillas.length);

const CLASES_NODO = ['apagado','destacado','foco','lejano','vecino-sal','vecino-ent','vecino-amb'];
const CLASES_ARISTA = ['apagada','destacada','sal','ent','interna','lejana','roce'];

function limpiarResalte(){
  flujoActivo = null; focoSemillas = null; focoEtiqueta = null;
  document.querySelectorAll('.grupo.on').forEach(g=>g.classList.remove('on'));
  elNodo.forEach(v => {
    v.g.classList.remove(...CLASES_NODO);
    v.caja.style.stroke = '';
    v.num.style.display = 'none';
  });
  elArista.forEach(({el}) => {
    el.classList.remove(...CLASES_ARISTA);
    el.setAttribute('marker-end','url(#pf)');
  });
  $('#pasos').classList.add('no');
  document.querySelectorAll('.flujo').forEach(f=>f.classList.remove('on'));
}

// Recorrido en anchura en AMBOS sentidos desde un conjunto de semillas, hasta
// `prof` saltos. Devuelve id → { d, dir } con dir = 'sal' (el conjunto depende
// de él), 'ent' (él depende del conjunto) o 'amb' cuando se llega por los dos
// lados. Con una sola semilla es la vecindad de un nodo; con muchas, la de un
// módulo o una capa entera — el mismo cálculo sirve para los tres casos.
function vecindad(semillas, prof){
  const sem = (Array.isArray(semillas) ? semillas : [semillas]).filter(id => N.has(id));
  const vis = new Map(sem.map(id => [id, { d:0, dir:'foco' }]));
  let frente = sem;
  for(let d=1; d<=prof && frente.length; d++){
    const sig = [];
    for(const a of frente){
      const marcar = (b, dir) => {
        const y = vis.get(b);
        if(!y){ vis.set(b, { d, dir }); sig.push(b); }
        else if(y.d===d && y.dir!==dir && y.dir!=='foco') y.dir = 'amb';
      };
      salidas.get(a).forEach(e => marcar(e.to, 'sal'));
      entradas.get(a).forEach(e => marcar(e.from, 'ent'));
    }
    frente = sig;
  }
  return vis;
}

// Ilumina lo relacionado con un conjunto de nodos: el conjunto en el centro, sus
// vecinos coloreados por dirección y el resto atenuado. Las aristas que quedan
// DENTRO del conjunto se pintan aparte: en un módulo o una capa son su cohesión
// interna, y mezclarlas con las que cruzan la frontera es justo lo que impide
// ver dónde empieza y acaba el grupo.
function resaltarConjunto(semillas, etiqueta, prof = salto){
  const sem = (Array.isArray(semillas) ? semillas : [semillas]).filter(id => N.has(id));
  if(!sem.length) return;
  limpiarResalte();
  focoSemillas = sem; focoEtiqueta = etiqueta;
  const dentro = new Set(sem);
  const vis = vecindad(sem, prof);

  elNodo.forEach((v, nid) => {
    const m = vis.get(nid);
    if(!m){ v.g.classList.add('apagado'); return; }
    if(m.d === 0) v.g.classList.add('foco');
    else if(m.d === 1) v.g.classList.add(m.dir==='amb' ? 'vecino-amb' : m.dir==='sal' ? 'vecino-sal' : 'vecino-ent');
    else v.g.classList.add('lejano');
  });

  let internas = 0, sale = 0, entra = 0;
  elArista.forEach(({e, el}) => {
    const a = dentro.has(e.from), b = dentro.has(e.to);
    if(a && b){ el.classList.add('interna'); internas++; return; }
    if(a && vis.has(e.to)){ el.classList.add('sal'); el.setAttribute('marker-end','url(#pf-sal)'); sale++; return; }
    if(b && vis.has(e.from)){ el.classList.add('ent'); el.setAttribute('marker-end','url(#pf-ent)'); entra++; return; }
    if(vis.has(e.from) && vis.has(e.to)) el.classList.add('lejana');
    else el.classList.add('apagada');
  });

  avisar(sem.length === 1
    ? `${etiqueta}: ${sale} dependencias · ${entra} dependientes · ${vis.size-1} relacionados en total`
    : `${etiqueta}: ${sem.length} nodos · ${internas} relaciones internas · ${sale} salen del grupo · ${entra} entran`);
}

const resaltarNodo  = (id, prof)  => resaltarConjunto([id], N.get(id)?.nombre ?? id, prof);
const resaltarGrupo = (ids, etiq) => resaltarConjunto(ids, etiq);

function resaltarFlujo(f){
  limpiarResalte();
  flujoActivo = f;
  const secuencia = f.pasos.map(p=>p.nodo).filter(id=>N.has(id));
  const conj = new Set([...(f.componentes||[]), ...secuencia].filter(id=>N.has(id)));
  const orden = new Map();
  f.pasos.forEach(p => { if(N.has(p.nodo) && !orden.has(p.nodo)) orden.set(p.nodo, p.n); });

  elNodo.forEach((v,id) => {
    if(conj.has(id)){
      v.g.classList.add('destacado');
      v.caja.style.stroke = colorCapa(N.get(id).capa);
      if(orden.has(id)){ v.num.style.display=''; v.numTx.textContent = orden.get(id); }
    } else v.g.classList.add('apagado');
  });

  const pares = new Set();
  for(let i=0;i<secuencia.length-1;i++) pares.add(secuencia[i]+'→'+secuencia[i+1]);
  elArista.forEach(({e,el}) => {
    const dentro = conj.has(e.from) && conj.has(e.to);
    if(pares.has(e.from+'→'+e.to) || dentro){
      el.classList.add('destacada'); el.setAttribute('marker-end','url(#pf-on)');
    } else el.classList.add('apagada');
  });

  pintarPasos(f);
  const p0 = f.pasos[0] && pos.get(f.pasos[0].nodo);
  if(p0) encajarConjunto(conj);
}

function encajarConjunto(conj){
  const r = lienzo.getBoundingClientRect();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, hay=false;
  conj.forEach(id => { const p=pos.get(id); if(!p) return; hay=true;
    x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x+AN); y1=Math.max(y1,p.y+AL); });
  if(!hay) return;
  const pad=80;
  vk = Math.min((r.width-pad*2)/(x1-x0), (r.height-pad*2)/(y1-y0), 1.1);
  vk = Math.max(0.08, vk);
  vx = pad + (r.width-pad*2-(x1-x0)*vk)/2 - x0*vk;
  vy = pad + (r.height-pad*2-(y1-y0)*vk)/2 - y0*vk;
  aplicar();
}

function pintarPasos(f){
  const c = $('#pasos');
  c.classList.remove('no');
  c.innerHTML =
    `<div class="tit" style="margin-top:0">Secuencia — ${esc(f.nombre)}</div>` +
    f.pasos.map(p => {
      const n = N.get(p.nodo);
      return `<div class="paso"><div class="n" data-ir="${esc(p.nodo)}">${p.n}</div><div class="c">`+
        `<h4>${esc(p.titulo)}</h4><p>${esc(p.detalle)}</p>`+
        (n?`<code>${esc(n.nombre)}${p.archivo?' · '+esc(p.archivo):''}</code>`:(p.archivo?`<code>${esc(p.archivo)}</code>`:''))+
        `</div></div>`;
    }).join('');
  c.querySelectorAll('.n').forEach(b => b.onclick = () => {
    const id = b.dataset.ir;

    pulso(id);
  });
  c.scrollTop = 0;
}
function pulso(id){
  const v = elNodo.get(id); if(!v) return;
  v.g.classList.add('sel');
  setTimeout(()=>v.g.classList.remove('sel'), 1400);
}

// Cuenta las relaciones de un grupo: cuántas se quedan dentro y cuántas cruzan
// la frontera en cada sentido. Es la medida de si el grupo está bien delimitado.
function balance(ids){
  const G = new Set(ids);
  let dentro=0, sale=0, entra=0;
  const vecinos = new Set();
  for(const e of E){
    const a = G.has(e.from), b = G.has(e.to);
    if(a && b) dentro++;
    else if(a){ sale++; vecinos.add(e.to); }
    else if(b){ entra++; vecinos.add(e.from); }
  }
  return { dentro, sale, entra, vecinos: vecinos.size };
}

// Tarjeta de grupo: cabecera con el balance de relaciones y, plegada, la lista
// de sus nodos.
function tarjetaGrupo(o){
  const b = balance(o.nodos);
  return `<div class="grupo" data-g="${esc(o.id)}" style="--cg:${o.color}">
      <h3><span class="sw" style="background:${o.color}"></span>${esc(o.nombre)}</h3>
      <p>${esc(o.descripcion)}</p>
      <div class="meta">
        <span class="chip ac">${o.nodos.length} nodos</span>
        <span class="chip">${b.dentro} internas</span>
        <span class="chip s">${b.sale} salen</span>
        <span class="chip e">${b.entra} entran</span>
      </div>
      ${o.extra ? `<div class="rutas">${esc(o.extra)}</div>` : ''}
      <details><summary>Ver sus ${o.nodos.length} nodos</summary>
        ${o.nodos.map(id => { const n = N.get(id); return n ? `<div class="enl" data-ir="${esc(id)}">
          <span class="punto" style="background:${colorCapa(n.capa)};margin-top:0"></span>
          <span>${esc(n.nombre)}</span><span class="fl">${esc(n.tipo)}</span></div>` : ''; }).join('')}
      </details>
    </div>`;
}

function pintarGrupos(){
  const mods = D.modules.map(m => ({
    id:'mod:'+m.id, nombre:m.nombre, descripcion:m.descripcion, color:'var(--acento)',
    nodos:m.nodos.filter(id=>N.has(id)), extra:(m.rutas||[]).join('  ·  '),
  }));
  const caps = CAPAS.map(c => ({
    id:'capa:'+c.id, nombre:c.nombre, descripcion:c.descripcion, color:colorCapa(c.id),
    nodos:D.nodes.filter(n=>n.capa===c.id).map(n=>n.id), extra:'',
  }));
  GRUPOS.clear();
  [...mods, ...caps].forEach(g => GRUPOS.set(g.id, g));

  $('#h-capas').innerHTML =
    `<div class="tit">Módulos funcionales · ${mods.length}</div>` + mods.map(tarjetaGrupo).join('') +
    `<div class="tit">Capas técnicas · ${caps.length}</div>` + caps.map(tarjetaGrupo).join('');

  const cont = $('#h-capas');
  enlazarIr(cont);
  cont.querySelectorAll('.grupo').forEach(el => {
    // El clic ilumina el grupo, salvo que sea sobre la lista desplegable o sobre
    // un nodo concreto: ahí el gesto quiere decir otra cosa.
    el.addEventListener('click', ev => {
      if(ev.target.closest('details') || ev.target.closest('[data-ir]')) return;
      const g = GRUPOS.get(el.dataset.g);
      if(!g) return;
      if(el.classList.contains('on')){ limpiarResalte(); ajustar(); return; }
      resaltarGrupo(g.nodos, g.nombre);
      el.classList.add('on');
      encajarConjunto(new Set(vecindad(g.nodos, 1).keys()));
    });
  });
}
const GRUPOS = new Map();

// Iluminar una capa desde su rótulo en el propio grafo.
function grupoDeCapa(capaId){
  const c = CAPAS.find(x=>x.id===capaId); if(!c) return;
  const ids = D.nodes.filter(n=>n.capa===capaId).map(n=>n.id);
  resaltarGrupo(ids, c.nombre);

  if(card){ cambiarHoja('capas'); card.classList.add('on'); card.scrollIntoView({block:'center'}); }
}

// Cualquier elemento con data-gr="mod:… | capa:…" ilumina ese grupo entero y
// lleva a su tarjeta en el panel.
function enlazarGrupos(root){
  root.querySelectorAll('[data-gr]').forEach(el => el.onclick = () => {
    const g = GRUPOS.get(el.dataset.gr); if(!g) return;
    resaltarGrupo(g.nodos, g.nombre);

    if(card){ card.classList.add('on'); card.scrollIntoView({block:'center'}); }

function enlazarIr(root){
  root.querySelectorAll('[data-ir]').forEach(el => el.onclick = () => {
    const id = el.dataset.ir;

  $('#i-tipo').textContent = `${cap?cap.nombre:n.capa} · ${n.tipo}`;

  $('#i-nombre').textContent = n.nombre;
  $('#i-desc').textContent = n.descripcion;

  const dep = salidas.get(id), dee = entradas.get(id);
  const flujos = D.flows.filter(f => (f.componentes||[]).includes(id) || f.pasos.some(p=>p.nodo===id));
  const bloque = (t,html) => html ? `<div class="sec"><h5>${t}</h5>${html}</div>` : '';
  const listaCod = a => (a&&a.length) ? `<div class="lista">${a.map(x=>`<code>${esc(x)}</code>`).join('')}</div>` : '';
  const tags = a => (a&&a.length) ? `<div class="tags">${a.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>` : '';
  const enlaces = (arr, key) => arr.length ? `<div>${arr.map(e=>{
      const o = N.get(e[key]); if(!o) return '';
      return `<div class="enl" data-ir="${esc(o.id)}">
        <span class="punto" style="background:${colorCapa(o.capa)};margin-top:0"></span>
        <span>${esc(o.nombre)}</span><span class="fl">${esc(e.etiqueta||e.tipo)}</span></div>`;
    }).join('')}</div>` : '';

  const acciones =
    `<div class="sec">
       <div style="display:flex;gap:6px;flex-wrap:wrap">
         <button class="btn" id="i-aislar">Iluminar lo relacionado</button>
         <button class="btn" id="i-encajar">Encajar en pantalla</button>
       </div>
       <div class="clave">
         <i class="s">depende de (${dep.length})</i>
         <i class="e">dependen de él (${dee.length})</i>
         <i class="l">a más saltos</i>
       </div>
     </div>`;

  $('#i-cuerpo').innerHTML = acciones +
    bloque('Responsabilidad', n.responsabilidad?`<p>${esc(n.responsabilidad)}</p>`:'') +
    bloque(`Archivos · ${(n.archivos||[]).length}`, listaCod(n.archivos)) +
    bloque('Tecnologías', tags(n.tecnologias)) +
    bloque(`APIs · ${(n.apis||[]).length}`, listaCod(n.apis)) +
    bloque(`Base de datos · ${(n.basedatos||[]).length}`, listaCod(n.basedatos)) +
    bloque(`Dependencias · ${dep.length}`, enlaces(dep,'to')) +
    bloque(`Dependientes · ${dee.length}`, enlaces(dee,'from')) +
    bloque('Grupos a los que pertenece', `<div>` +
      D.modules.filter(m=>m.nodos.includes(id)).map(m=>`<div class="enl" data-gr="mod:${esc(m.id)}">
        <span class="punto" style="background:var(--acento);margin-top:0"></span>
        <span>${esc(m.nombre)}</span><span class="fl">módulo · ${m.nodos.length} nodos</span></div>`).join('') +
      (()=>{ const c = CAPAS.find(x=>x.id===n.capa); return c ? `<div class="enl" data-gr="capa:${esc(c.id)}">
        <span class="punto" style="background:${colorCapa(n.capa)};margin-top:0"></span>
        <span>${esc(c.nombre)}</span><span class="fl">capa · ${D.nodes.filter(x=>x.capa===n.capa).length} nodos</span></div>` : ''; })() +
      `</div>`) +
    bloque(`Flujos que lo atraviesan · ${flujos.length}`, flujos.length
      ? `<div>${flujos.map(f=>`<div class="enl" data-fl="${esc(f.id)}">
          <span class="punto" style="background:var(--acento);margin-top:0"></span>
          <span>${esc(f.nombre)}</span><span class="fl">${f.pasos.length} pasos</span></div>`).join('')}</div>` : '') +
    bloque('Etiquetas', tags(n.etiquetas));

  enlazarIr($('#i-cuerpo'));
  $('#i-aislar').onclick = () => resaltarNodo(id);
  $('#i-encajar').onclick = () => encajarConjunto(new Set(vecindad([id], salto).keys()));
  enlazarGrupos($('#i-cuerpo'));
  $('#i-cuerpo').querySelectorAll('[data-fl]').forEach(el => el.onclick = () => {
    const f = D.flows.find(x=>x.id===el.dataset.fl);
    if(f){ resaltarFlujo(f); cambiarHoja('flujos');
      const card = document.querySelector(`.flujo[data-f="${f.id}"]`);
      if(card){ card.classList.add('on'); card.scrollIntoView({block:'nearest'}); } }
  });
  $('#info').classList.add('abierto');
}
$('#i-cerrar').onclick = () => { $('#info').classList.remove('abierto'); elNodo.forEach(v=>v.g.classList.remove('sel')); };

/* ── Búsqueda ────────────────────────────────────────────── */
const indice = [];
D.nodes.forEach(n => {
  indice.push({ t:n.nombre, s:`${n.tipo} · ${(CAPAS.find(c=>c.id===n.capa)||{}).nombre||''}`, id:n.id, c:n.capa, k:(n.nombre+' '+n.tipo+' '+n.descripcion+' '+(n.etiquetas||[]).join(' ')).toLowerCase() });
  (n.archivos||[]).forEach(a => indice.push({ t:a, s:'archivo → '+n.nombre, id:n.id, c:n.capa, k:a.toLowerCase() }));
  (n.apis||[]).forEach(a => indice.push({ t:a, s:'api → '+n.nombre, id:n.id, c:n.capa, k:a.toLowerCase() }));
});
D.apis.forEach(a => indice.push({ t:`${a.metodo} ${a.ruta}`, s:'endpoint · '+a.auth, id:a.nodo, c:'api', k:(a.ruta+' '+a.descripcion).toLowerCase() }));
D.database.forEach(t => indice.push({ t:t.tabla||t.objeto, s:'tabla/objeto · '+t.grupo, id:t.nodo, c:'datos', k:((t.tabla||t.objeto)+' '+t.descripcion).toLowerCase() }));
D.files.forEach(f => indice.push({ t:f.ruta, s:'archivo clave · '+f.rol, id:f.nodo, c:'infra', k:(f.ruta+' '+f.rol).toLowerCase() }));
D.jobs.forEach(j => indice.push({ t:j.nombre, s:'job · '+j.frecuencia, id:j.id, c:'jobs', k:(j.nombre+' '+j.disparador).toLowerCase() }));
D.events.forEach(e => indice.push({ t:e.nombre, s:'evento · '+e.tipo, id:e.origen, c:'repos', k:(e.nombre+' '+e.efecto).toLowerCase() }));
D.flows.forEach(f => indice.push({ t:f.nombre, s:'flujo · '+f.categoria, id:null, flujo:f.id, c:'jobs', k:(f.nombre+' '+f.descripcion+' '+(f.apis||[]).join(' ')).toLowerCase() }));

const q = $('#q'), sug = $('#sug');
let sel = -1, res = [];
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  if(v.length < 2){ sug.classList.remove('abierto'); return; }
  const tk = v.split(/\s+/);
  res = indice.filter(i => tk.every(t => i.k.includes(t))).slice(0,28);
  sel = -1;
  sug.innerHTML = res.length
    ? res.map((r,i)=>`<div class="sug" data-i="${i}"><span class="punto" style="background:${colorCapa(r.c)}"></span>
        <span style="min-width:0"><b>${esc(r.t)}</b><i>${esc(r.s)}</i></span></div>`).join('')
    : `<div class="sug"><span style="color:var(--tx3)">Sin resultados</span></div>`;
  sug.classList.add('abierto');
  sug.querySelectorAll('.sug[data-i]').forEach(el => el.onclick = () => elegir(res[+el.dataset.i]));
});
q.addEventListener('keydown', ev => {
  if(!sug.classList.contains('abierto')) return;
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){
    ev.preventDefault();
    sel = Math.max(0, Math.min(res.length-1, sel + (ev.key==='ArrowDown'?1:-1)));
    sug.querySelectorAll('.sug').forEach((e,i)=>e.classList.toggle('sel', i===sel));
  } else if(ev.key==='Enter'){ ev.preventDefault(); elegir(res[sel<0?0:sel]); }
  else if(ev.key==='Escape'){ sug.classList.remove('abierto'); }
});
function elegir(r){
  if(!r) return;
  sug.classList.remove('abierto'); q.blur();
  if(r.flujo){
    const f = D.flows.find(x=>x.id===r.flujo);
    if(f){ resaltarFlujo(f); cambiarHoja('flujos');
      const c = document.querySelector(`.flujo[data-f="${f.id}"]`);
      if(c){ c.classList.add('on'); c.scrollIntoView({block:'center'}); } }
    return;
  }
  if(r.id && N.has(r.id)){ abrirInfo(r.id); centrarEn(r.id, Math.max(vk,.95)); pulso(r.id); }
}
document.addEventListener('click', ev => { if(!ev.target.closest('.buscador')) sug.classList.remove('abierto'); });

/* ── Leyenda / filtro por capa ───────────────────────────── */
const capasOcultas = new Set();
function pintarLeyenda(){
  $('#leyenda').innerHTML = CAPAS.map(c => {
    const n = D.nodes.filter(x=>x.capa===c.id).length;
    return `<button data-c="${esc(c.id)}" title="${esc(c.descripcion)}\n\nClic: ocultar o mostrar esta capa.\nPara iluminar sus relaciones, usa su rótulo en el grafo o su tarjeta en la pestaña Grupos.">
      <span class="sw" style="background:${colorCapa(c.id)}"></span>${esc(c.nombre)} <span style="color:var(--tx3)">${n}</span></button>`;
  }).join('');
  $('#leyenda').querySelectorAll('button').forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    if(capasOcultas.has(c)) capasOcultas.delete(c); else capasOcultas.add(c);
    b.classList.toggle('off', capasOcultas.has(c));
    aplicarFiltro();
  });
}
function aplicarFiltro(){
  elNodo.forEach((v,id) => {
    const oculto = capasOcultas.has(N.get(id).capa);
    v.g.style.display = oculto ? 'none' : '';
  });
  elArista.forEach(({e,el}) => {
    const oculto = capasOcultas.has(N.get(e.from).capa) || capasOcultas.has(N.get(e.to).capa);
    el.style.display = oculto ? 'none' : '';
  });
}

/* ── Pestañas y botones ──────────────────────────────────── */
function cambiarHoja(h){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.h===h));
  ['flujos','capas','catalogo'].forEach(x => $('#h-'+x).classList.toggle('no', x!==h));
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => cambiarHoja(b.dataset.h));

$('#salto').querySelectorAll('button').forEach(b => b.onclick = () => {
  salto = +b.dataset.p;
  $('#salto').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
  if(hayFoco()) resaltarConjunto(focoSemillas, focoEtiqueta);
});

$('#b-reacomodar').onclick = () => {
  const f = flujoActivo, sem = focoSemillas, etiq = focoEtiqueta;
  calcularLayout(); dibujar(); aplicarFiltro(); ajustar();
  if(f) resaltarFlujo(f); else if(sem) resaltarConjunto(sem, etiq);
  avisar('Posiciones recalculadas');
};
$('#b-ajustar').onclick = () => ajustar();
$('#b-limpiar').onclick = () => { limpiarResalte(); ajustar(); };
$('#b-panel').onclick = () => $('#aside').classList.toggle('oculto');
$('#z-mas').onclick = () => { vk=Math.min(2.6,vk*1.25); aplicar(); };
$('#z-menos').onclick = () => { vk=Math.max(0.06,vk/1.25); aplicar(); };
$('#z-reset').onclick = () => ajustar();
$('#b-tema').onclick = () => {
  const t = document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.dataset.tema = t;
  try{ localStorage.setItem('arq-tema', t); }catch(e){}
};
try{ const t = localStorage.getItem('arq-tema'); if(t) document.documentElement.dataset.tema = t; }catch(e){}

let tAviso;
function avisar(txt){
  const a = $('#aviso'); a.textContent = txt; a.classList.add('ver');
  clearTimeout(tAviso); tAviso = setTimeout(()=>a.classList.remove('ver'), 1800);
}

document.addEventListener('keydown', ev => {
  if(ev.key==='/' && document.activeElement!==q){ ev.preventDefault(); q.focus(); }
  if(ev.key==='Escape'){ limpiarResalte(); $('#info').classList.remove('abierto'); }
});
addEventListener('resize', () => { if(!flujoActivo) ajustar(); });

/* ── Arranque ────────────────────────────────────────────── */
$('#h-nombre').textContent = D.project.nombre;
$('#h-sub').textContent = `${D.nodes.length} nodos · ${E.length} conexiones · ${D.flows.length} flujos`;
document.title = D.project.nombre + ' — Arquitectura y Flujos';
calcularLayout();
dibujar();
pintarLeyenda();
pintarFlujos();
pintarGrupos();
pintarCatalogo();
ajustar();
avisar('Clic en un nodo para iluminar lo relacionado · rueda para zoom · arrastra para mover');
})();
</script>
</body>
</html>

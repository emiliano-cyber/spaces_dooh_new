name: Deploy to Production

# ============================================================================
#  Despliegue MANUAL a producción. Reescrito el 2026-07-31 tras el despliegue
#  hecho a mano, que dejó ver que este workflow no habría funcionado. Tenía
#  cuatro defectos independientes, todos comprobados contra la máquina:
#
#   1. RUTA MUERTA. Apuntaba a /var/www/Marketplace/spaces-dooh, que no existe.
#      Con `set -e` moría en el primer `cd`. Es lo único que evitó que los otros
#      tres hicieran daño: la ruta real es /var/www/Spaces.
#
#   2. MIGRACIONES CON EL ROL EQUIVOCADO. Usaba `scripts/apply-migration.mjs`,
#      que lee DATABASE_URL de .env.production y conecta como `spaces_user`, el
#      rol de la APP. Ese rol no puede crear tablas ni alterar enums, así que
#      las migraciones de esquema fallan; y las tablas del módulo de
#      arrendadores tienen RLS fail-closed, así que una migración de datos —que
#      a propósito no fija ningún tenant— vería CERO filas, no repararía nada y
#      terminaría en verde. Un falso éxito, que es el peor resultado posible.
#      Ahora van con `psql` como `postgres`, igual que el runbook.
#
#   3. npm ci COMO ROOT. El checkout, node_modules y .next son de `emiliano`.
#      Instalar como root deja node_modules con dueño root y le rompe los
#      permisos al usuario que corre la app.
#
#   4. pm2 COMO ROOT. PM2 es POR USUARIO y el demonio vive en
#      /home/emiliano/.pm2; root no tiene ninguno. `pm2 reload` como root no
#      habría recargado nada: habría arrancado un SEGUNDO proceso bajo root,
#      peleándose por el puerto 3000 con el que ya sirve.
#
#  Regla que sale de todo esto: root entra, pero cada cosa corre como quien
#  debe. Base de datos → postgres. Aplicación → emiliano. Nunca al revés.
#
#  El disparador sigue siendo MANUAL. No es solo por el susto del merge: un
#  despliegue de este proyecto incluye migraciones que reescriben datos, y
#  quien lo lanza tiene que estar mirando. El runbook completo, con sus gates y
#  su rollback, está en docs/Runbook_Deploy_Fase1_Arrendadores.md.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o commit a desplegar'
        required: true
        default: main
      migraciones_de_datos:
        description: 'Aplicar también las migraciones marcadas "-- @tipo: datos" (reescriben filas y NO se deshacen solas)'
        type: boolean
        default: false

permissions:
  contents: read

# Nunca dos despliegues a la vez, y el que está en marcha NO se cancela: cortar
# a mitad de una migración es peor que esperar.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar a producción
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        env:
          # Las entradas viajan como VARIABLES DE ENTORNO y no interpoladas en
          # el texto del script. Un `${{ inputs.ref }}` dentro del script se
          # sustituye ANTES de que exista el shell, así que un valor con
          # `; rm -rf /` se ejecutaría. Como variable, es un dato.
          REF: ${{ inputs.ref }}
          MIGRAR_DATOS: ${{ inputs.migraciones_de_datos }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REF,MIGRAR_DATOS
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_DIR=/var/www/Spaces
            APP_USER=emiliano
            PM2_APP=spaces-web

            # Todo lo de la aplicación corre como su dueño (defectos 3 y 4).
            como_app() { su - "$APP_USER" -c "cd $APP_DIR && $1"; }

            # `REF` termina dentro de un `su -c "..."`, o sea dentro de un shell
            # anidado. Pasarlo por entorno evita que GitHub lo interpole en el
            # texto del script, pero no que el shell interior lo reinterprete:
            # un valor con comillas seguiría pudiendo colar comandos. Se acota
            # al juego de caracteres que puede tener una rama, un tag o un sha.
            # Solo puede lanzar esto quien tiene permiso de escritura en el
            # repo, así que es defensa en profundidad, no la única barrera.
            case "$REF" in
              ''|*[!A-Za-z0-9._/-]*)
                echo "Ref no válida: '$REF' (solo letras, dígitos y . _ / -)"; exit 1 ;;
            esac

            echo "::group::0 · Contexto y punto de rollback"
            cd "$APP_DIR"
            echo "commit actual (a donde se vuelve si algo falla):"
            git log --oneline -1

            # El nombre de la base sale de la CONFIGURACIÓN DE LA APP, no de una
            # constante: el runbook decía `spaces` —el nombre de local— y en
            # producción es `spaces_prod`. Derivarlo no puede quedarse viejo.
            DB=$(node -e "const u=new URL(require('fs').readFileSync('apps/web/.env.production','utf8').match(/DATABASE_URL=(.+)/)[1].trim());console.log(u.pathname.slice(1))")
            if [ -z "$DB" ]; then echo "No se pudo determinar la base de datos"; exit 1; fi
            echo "base de datos: $DB"
            echo "::endgroup::"

            echo "::group::1 · Backup"
            BK=/root/spaces_$(date +%Y%m%d_%H%M%S).dump
            sudo -u postgres pg_dump -d "$DB" -Fc -f "$BK"
            # Un pg_dump que falla deja un archivo de 0 bytes y la salida se ve
            # casi igual. Sin backup no se sigue: la migración de datos no se
            # deshace sola.
            if [ ! -s "$BK" ]; then echo "BACKUP VACÍO — abortado"; exit 1; fi
            ls -lh "$BK"
            echo "::endgroup::"

            echo "::group::2 · Código y build"
            # Antes que las migraciones a propósito: es el paso que más falla, y
            # fallar aquí no ha tocado la base todavía. PM2 sigue sirviendo el
            # bundle viejo hasta el reload del bloque 5.
            como_app "git fetch --all --tags --prune"
            como_app "git checkout --detach '$REF'"
            como_app "git log --oneline -1"
            como_app "npm ci --prefer-offline"
            como_app "npm --prefix apps/web run build"
            echo "::endgroup::"

            echo "::group::3 · Migraciones de esquema"
            # Como `postgres` (defecto 2). ON_ERROR_STOP aborta a la primera.
            # En orden lexicográfico: por eso los nombres llevan fecha delante.
            for f in $(ls db/migrations/*.sql | sort); do
              if grep -qiE '^-- *@tipo: *datos' "$f"; then
                echo "-- omitida (migración de DATOS): $f"
                continue
              fi
              echo "== $f"
              sudo -u postgres psql -d "$DB" -v ON_ERROR_STOP=1 -f "$f"
            done
            echo "::endgroup::"

            echo "::group::4 · Migraciones de datos"
            if [ "$MIGRAR_DATOS" = "true" ]; then
              for f in $(ls db/migrations/*.sql | sort); do
                grep -qiE '^-- *@tipo: *datos' "$f" || continue
                echo "== $f"
                # Sin `| tee`: en un pipe, `set -o pipefail` daría el estado del
                # tee y un fallo de psql pasaría desapercibido. El log del run
                # queda en GitHub, que es donde hay que leerlo — sobre todo el
                # bloque NOTICE, que dice qué NO se pudo reparar.
                sudo -u postgres psql -d "$DB" -v ON_ERROR_STOP=1 -f "$f" 2>&1
              done
            else
              echo "Omitidas: no se marcó 'migraciones_de_datos'."
              for f in $(ls db/migrations/*.sql | sort); do
                grep -qiE '^-- *@tipo: *datos' "$f" && echo "  pendiente: $f" || true
              done
            fi
            echo "::endgroup::"

            echo "::group::5 · Recarga (punto de no retorno del código)"
            como_app "pm2 reload $PM2_APP"
            sleep 6
            como_app "pm2 describe $PM2_APP | grep -iE 'status|uptime|restarts'"
            echo "::endgroup::"

            echo "::group::6 · Smoke test"
            fallos=0
            for r in "login/:200" "inicio/:307"; do
              ruta="${r%%:*}"; esperado="${r##*:}"
              codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/spaces-dooh/$ruta" || echo 000)
              echo "  /$ruta -> $codigo (esperado $esperado)"
              [ "$codigo" = "$esperado" ] || fallos=$((fallos+1))
            done
            if [ "$fallos" -gt 0 ]; then
              echo "SMOKE TEST FALLIDO. Rollback: checkout del commit del bloque 0, rebuild y pm2 reload."
              echo "La base NO se revierte sola: si corrieron migraciones de datos, restaurar desde $BK"
              exit 1
            fi
            echo "Despliegue completado."
            echo "::endgroup::"

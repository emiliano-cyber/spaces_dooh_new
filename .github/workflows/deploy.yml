name: Deploy to Production

# ============================================================================
#  SOLO MANUAL. Antes se disparaba con `push` a `main`, y eso convertía un merge
#  en un despliegue a producción sin que nadie lo pidiera.
#
#  El problema no es desplegar solo: es el bucle de abajo, que aplica TODAS las
#  migraciones del directorio. Mientras todas fueron aditivas e idempotentes eso
#  era inocuo. Con `20260731_calendario_meses_cortos.sql` dejó de serlo: es una
#  migración de DATOS que reescribe `pagos_renta` y no se deshace sola. Un merge
#  la habría corrido sin el respaldo previo que exige el runbook.
#
#  Y su reporte se habría perdido. `apply-migration.mjs` usa `pool.query()`, que
#  descarta los NOTICE del servidor, así que la lista de contratos que la
#  migración se NIEGA a reparar —los que necesitan que una persona decida— no
#  aparece por ningún lado. Comprobado: por esta vía la migración imprime
#  "OK — migración aplicada" y nada más.
#
#  ATENCIÓN si lo disparas a mano: este workflow está DESACTUALIZADO. Apunta a
#  `/var/www/Marketplace/spaces-dooh` y recarga `ecosystem.config.js`, mientras
#  que el despliegue real vive en `/var/www/Spaces` con el proceso PM2
#  `spaces-web`. El camino bueno es el manual por SSH que documenta
#  `docs/Runbook_Deploy_Fase1_Arrendadores.md`.
# ============================================================================

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx turbo run typecheck --filter=web

      - name: Build
        run: npx turbo run build --filter=web

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          script: |
            set -e
            cd /var/www/Marketplace/spaces-dooh

            echo "→ Pulling latest changes..."
            git pull origin main

            echo "→ Installing dependencies..."
            npm ci --prefer-offline

            echo "→ Building (solo el app web; el Fastify se archivó en _archive/api)..."
            npx turbo run build --filter=web

            echo "→ Applying ALL BFF SQL migrations in order (aditivas, idempotentes)..."
            # Aplica TODAS las migraciones del directorio en orden lexicográfico
            # (por eso el prefijo de fecha AAAAMMDD). Antes esto era una lista fija
            # de 4 y las nuevas nunca se aplicaban (p. ej. la tabla del almacén),
            # dejando prod inconsistente (hallazgo A-5).
            for f in $(ls db/migrations/*.sql | sort); do
              echo "  → $f"
              node scripts/apply-migration.mjs "$f"
            done

            echo "→ Reloading PM2..."
            pm2 reload ecosystem.config.js --update-env

            echo "✓ Deploy completado"
            pm2 list

name: Release

# ============================================================================
#  Un tag `vX.Y.Z` construye la imagen, la prueba ENTERA y la publica en el
#  canal `beta`. Un tag con la suite en rojo no publica nada.
#
#  Hermano de `ci.yml`, no su sustituto: `ci.yml` sigue cubriendo los PR y no se
#  toca. Lo que este añade es lo que allí falta y solo hace falta al publicar —
#  las pruebas de integración y la publicación de la imagen.
#
#  EL GATE ES EL ORDEN, y por eso importa leerlo entero antes de reordenar nada:
#  el push es el ÚLTIMO paso del ÚLTIMO job, y ese job entero cuelga de
#  `needs: pruebas`. No hay ninguna forma de que `beta` se mueva sin que antes
#  hayan pasado typecheck, unitarias y e2e. Si algún día alguien necesita
#  publicar «rápido», lo que tiene que cambiar es el plan, no el orden.
#
#  QUÉ NO HACE, a propósito: no publica `estable`. Promover es una decisión
#  humana y vive en `promover.yml` (F2.4), que reetiqueta sin reconstruir.
#  `beta` solo lo consume DEMO; ninguna instancia de owner mira este canal.
#
#  EL DESTINO ES UN PARÁMETRO, NUNCA UN LITERAL. `vars.REGISTRY` dice a dónde y
#  `vars.REGISTRY_TIPO` con qué credencial se entra. Las pone una persona en la
#  configuración del repositorio (tarjeta TH-P4); este archivo no las sabe y no
#  debe saberlas. Así el día que cambie el registry no se reescribe el workflow.
#
#  LA IMAGEN DICE DE QUÉ COMMIT SALIÓ, y eso no es un adorno de metadatos: es la
#  causa de que el incidente del 2026-09-14 costara DOS DÍAS. Aquel día el
#  registry tenía dos imágenes distintas con la misma etiqueta `v0.5.0`
#  (`d46c3aed…` y `60c7b194…`) y no había forma de preguntarle a ninguna de qué
#  código venía: hubo que deducirlo. Desde el 2026-09-25 cada imagen lleva
#  encima las etiquetas OCI estándar (B36, parte 1), así que la misma pregunta se
#  responde con un mandato:
#
#    docker buildx imagetools inspect <registry>/space-os:estable --format '{{json .Image}}'
#    docker inspect --format '{{json .Config.Labels}}' <imagen>     # si ya se bajó
#
#  Se ponen con `--label` en ESTA orden de build y NO como `LABEL` en el
#  `Dockerfile`, a propósito y por tres motivos:
#
#   · Los cuatro valores son hechos del CI (el SHA, el tag, el repositorio, el
#     instante), no entradas que el `Dockerfile` necesite para construir. Por el
#     camino del `Dockerfile` habría que añadir un `ARG` y un `LABEL` por cada
#     uno Y pasar igualmente un `--build-arg` por cada uno desde aquí: el mismo
#     cambio en el workflow, más un cambio en el `Dockerfile`.
#   · Un `ARG` con valor por omisión publicaría `revision=desconocida` en
#     cualquier build local. Una etiqueta que existe y no dice nada es peor que
#     una ausente: la ausencia significa «esta imagen NO salió del pipeline», que
#     es exactamente lo que interesa distinguir.
#   · `--label` escribe en la configuración de la imagen final y no crea ni
#     invalida ninguna capa, así que no toca la caché escalonada que el
#     `Dockerfile` cuida en `deps`.
#
#  `VERSION` sigue por `--build-arg` porque es lo ÚNICO que la aplicación lee en
#  ejecución (`SPACE_OS_VERSION` → `/api/version`). Una etiqueta OCI no se puede
#  leer desde dentro del contenedor; un `ENV`, sí. No son sustitutos.
#
#  SEGURIDAD — las mismas dos reglas que documenta `ci.yml:17-30`, más una:
#
#   · El disparador es `push` de tags, o sea código ya en el repositorio. Nunca
#     `pull_request_target`: eso daría estos secretos a código de un fork.
#   · El job `pruebas` corre con `contents: read` y NADA MÁS. Es el que ejecuta
#     código de pruebas y arranca un servidor; no tiene por qué sostener un
#     token capaz de publicar. El permiso de escritura vive solo en `imagen`.
#   · Los valores de entrada (`github.ref_name`, `vars.*`) viajan como VARIABLES
#     DE ENTORNO y se validan contra una expresión antes de usarse. El motivo
#     está escrito en `deploy.yml:70-102`: un `${{ ... }}` dentro del texto de un
#     script se sustituye ANTES de que exista el shell, así que un valor con
#     `; rm -rf /` se ejecutaría. Como variable, es un dato.
# ============================================================================

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

# SIN cancelación, al revés que `ci.yml`. Allí lo que importa es el último
# commit y una corrida vieja solo gasta minutos. Aquí cada corrida publica un
# artefacto: cancelarla a medias podría dejar el tag de versión subido y `beta`
# apuntando a otra cosa. Se dejan terminar.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  #  pruebas — la suite COMPLETA, que es lo que `ci.yml` no llega a correr
  # ==========================================================================
  pruebas:
    name: Suite completa · typecheck, unitarias y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      # Postgres de verdad, que es el punto: las unitarias simulan la base y por
      # eso NO ven un fallo de RLS. Los dos peores fallos de aislamiento del
      # proyecto pasaron las unitarias sin despeinarse.
      #
      # La base se llama `spaces_e2e` y no es cosmético: el arnés se NIEGA a
      # trabajar contra una base cuyo nombre no acabe en `_e2e` o `_test`
      # (`apps/web/lib/test/db-e2e.ts:43-60`), porque recrea el esquema con
      # `drop schema public cascade`. Crearla aquí con POSTGRES_DB es todo lo
      # que hay que hacer: el esquema y las 67 migraciones las aplica
      # `recrearEsquema()` en cada archivo de prueba.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spaces_e2e
        ports:
          - 5432:5432
        # Sin healthcheck, el primer `npm ci` gana la carrera y las pruebas se
        # estrellan contra un Postgres que todavía no escucha.
        options: >-
          --health-cmd "pg_isready -U postgres -d spaces_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # DOS conexiones, y la distinción es lo que hace válidas las pruebas
      # (`db-e2e.ts:62-78`):
      #
      #  · ADMIN — superusuario. Recrea el esquema y siembra varios tenants, que
      #    exige saltarse la RLS. En local es `spaces`; aquí, `postgres`.
      #  · APP  — `spaces_app`, NOSUPERUSER NOBYPASSRLS, el equivalente de
      #    `spaces_user` en producción. Todo lo que deba RESPETAR la RLS.
      #
      # El rol `spaces_app` NO se crea aquí a mano: lo crea `recrearEsquema()`
      # aplicando `db/dev-rol-app.sql` antes que nada, y los GRANT se los da la
      # migración `20260715_arr_m6_rol_restringido.sql`. Montar la base por otro
      # camino sería la segunda copia de un procedimiento que ya existe, y dos
      # copias divergen: el runner probaría un montaje que no usa nadie más.
      # (De paso, es lo que resuelve el `raise exception` de
      # `20260729_licencias_permisos.sql:96-97` — 13 migraciones exigen que el
      # rol de aplicación exista ANTES de correr.)
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/spaces_e2e
      DATABASE_URL_TEST_APP: postgresql://spaces_app:spaces_app_dev@localhost:5432/spaces_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # NO SE PUBLICA UNA VERSIÓN SIN SUS NOTAS (pedido del dueño, 2026-10-01).
      # Cada cliente ve, después de instalar, qué trae la versión; si el tag no
      # tiene su entrada en `apps/web/novedades.json`, ese diálogo no saldría y
      # el panel de Actualizaciones diría «Esta versión no trae notas».
      #
      # Va AQUÍ, lo primero tras tener node y ANTES del `npm ci`, a propósito:
      # es la comprobación más barata de todo el workflow (un JSON) y la que más
      # fácil se olvida. Más abajo costaría la suite entera —45 minutos de tope—
      # descubrir que faltaba un párrafo. El script no tiene dependencias
      # (`scripts/verificar-novedades.mjs`, con su prueba), así que no necesita
      # el `npm ci`.
      #
      # La versión viaja como VARIABLE DE ENTORNO y no como `${{ }}` dentro del
      # script, por el motivo de la cabecera. El script valida su forma (sale
      # con 2 si no es vX.Y.Z[-sufijo]) y valida el archivo ENTERO, no solo que
      # exista la entrada.
      - name: Comprobar que la versión trae sus notas
        env:
          VERSION: ${{ github.ref_name }}
        run: node scripts/verificar-novedades.mjs "$VERSION"

      # `npm ci` y no `npm install`, por el motivo que documenta `ci.yml:63-68`:
      # instala exactamente el árbol del lockfile en vez de arreglarlo por su
      # cuenta y publicar una imagen construida sobre dependencias que no probó
      # nadie.
      - name: Instalar dependencias
        run: npm ci

      # De más rápido a más lento, para que el fallo llegue cuanto antes.
      - name: Typecheck
        run: npx turbo run typecheck --filter=web

      - name: Pruebas unitarias
        run: npx turbo run test --filter=web

      # ESTE PASO NO ES OPCIONAL Y NO ES «el build de la imagen».
      # `apps/web/lib/test/servidor-e2e.ts:31` arranca el servidor con
      # `npx next start`, que REUTILIZA el build existente y no construye nada.
      # Un runner siempre parte de un clon limpio, o sea sin `.next/BUILD_ID`:
      # sin este paso, TODOS los archivos e2e mueren con «El servidor de pruebas
      # no respondió … tras 60 s» y tardan 636 s en hacerlo. El rojo no diría
      # nada del código — diría que falta el build.
      #
      # El build de la imagen es otro y ocurre dentro del `docker build`, en el
      # job siguiente y desde cero.
      - name: Build de producción (lo exigen las e2e)
        run: npx turbo run build --filter=web

      # Las e2e corren en SERIE contra el Postgres del servicio y contra un Next
      # real. `--prefix apps/web` no es un adorno: `recrearEsquema()` resuelve
      # `db/` como `<cwd>/../../db` y el arnés arranca el servidor en su `cwd`.
      - name: Pruebas de integración (e2e)
        run: npm --prefix apps/web run test:e2e

  # ==========================================================================
  #  imagen — construir y publicar. Solo se llega aquí con las dos suites en
  #  verde: `needs: pruebas`.
  # ==========================================================================
  imagen:
    name: Construir y publicar en el canal beta
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      VERSION: ${{ github.ref_name }}
      REGISTRY: ${{ vars.REGISTRY }}
      REGISTRY_TIPO: ${{ vars.REGISTRY_TIPO }}

    steps:
      # Primero lo que puede faltar, antes de gastar diez minutos construyendo.
      # Fail-closed: si el destino no está configurado, esto se para con un rojo
      # que dice qué falta. La alternativa —seguir y no publicar— daría un run
      # verde sin imagen, que es exactamente el estado que nadie mira.
      - name: Comprobar que el destino está configurado
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY:-}" ] || [ -z "${REGISTRY_TIPO:-}" ]; then
            echo "::error::Faltan las variables del repositorio REGISTRY y/o REGISTRY_TIPO."
            echo "El destino de la imagen es un PARÁMETRO, nunca un literal en este archivo."
            echo "Las fija una persona (tarjeta TH-P4), por ejemplo:"
            echo '  gh variable set REGISTRY      --body "registry.digitalocean.com/<nombre>"'
            echo '  gh variable set REGISTRY_TIPO --body "docr"'
            echo '  gh secret   set DO_REGISTRY_TOKEN'
            exit 1
          fi
          # Acotado al juego de caracteres que puede tener una referencia de
          # imagen: esto acaba dentro de un `docker build -t`.
          case "$REGISTRY" in
            *[!A-Za-z0-9._:/-]*)
              echo "::error::REGISTRY no válido: '$REGISTRY' (solo letras, dígitos y . _ : / -)"
              exit 1 ;;
          esac

      # La versión sale del NOMBRE DEL TAG y se valida antes de tocar nada.
      # El patrón admite sufijo de precandidata (`v0.0.1-rc1`) porque el propio
      # filtro `v*.*.*` del disparador lo deja pasar: si aquí se rechazara, el
      # primer tag de ensayo moriría en un sitio que no explica por qué.
      - name: Validar la versión
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Versión no válida: '$VERSION'. Se esperaba vX.Y.Z o vX.Y.Z-sufijo."
            exit 1
          fi
          echo "Versión a publicar: $VERSION"

      - name: Checkout
        uses: actions/checkout@v4

      # El login se elige por REGISTRY_TIPO, no por el nombre del registry: así
      # cambiar de destino no obliga a reescribir este paso.
      #
      # El host es el primer segmento de REGISTRY, que trae también el espacio
      # de nombres (`registry.digitalocean.com/space-os`). Derivarlo evita una
      # tercera variable que podría quedarse desincronizada de la primera.
      #
      # La contraseña entra siempre por STDIN (`--password-stdin`): con `-p` se
      # queda en el historial del proceso y docker lo avisa en cada corrida.
      - name: Entrar al registry
        env:
          DO_REGISTRY_TOKEN: ${{ secrets.DO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          HOST="${REGISTRY%%/*}"
          case "$REGISTRY_TIPO" in
            docr)
              if [ -z "${DO_REGISTRY_TOKEN:-}" ]; then
                echo "::error::REGISTRY_TIPO=docr pero falta el secreto DO_REGISTRY_TOKEN."
                exit 1
              fi
              # DigitalOcean Container Registry autentica con el token de API
              # como usuario Y como contraseña; no hay par usuario/clave aparte.
              printf '%s' "$DO_REGISTRY_TOKEN" \
                | docker login "$HOST" --username "$DO_REGISTRY_TOKEN" --password-stdin
              ;;
            ghcr)
              printf '%s' "$GITHUB_TOKEN" \
                | docker login "$HOST" --username "$ACTOR" --password-stdin
              ;;
            *)
              echo "::error::REGISTRY_TIPO='$REGISTRY_TIPO' desconocido. Valores admitidos: docr, ghcr."
              exit 1 ;;
          esac
          echo "Sesión abierta en $HOST"

      # El contexto es la RAÍZ del monorepo, como manda el `Dockerfile`. La
      # versión se SELLA en el artefacto (`ARG VERSION` → `SPACE_OS_VERSION`):
      # es lo que permite preguntarle a una instancia qué está corriendo sin
      # entrar por ssh.
      #
      # Las DOS etiquetas se ponen aquí, sobre la MISMA imagen: `beta` y la
      # versión son dos nombres de un solo digest, no dos construcciones. Dos
      # `docker build` producirían binarios distintos y `beta` dejaría de
      # corresponder a la versión que se probó.
      #
      # LAS CUATRO ETIQUETAS OCI, y por qué exactamente estas cuatro (B36):
      #
      #  · `revision`  — EL SHA DEL COMMIT. Es la que resuelve el incidente del
      #    14/09 y la única imprescindible: con ella, `git show <sha>` responde
      #    en un minuto lo que aquel día costó dos días deducir.
      #  · `version`   — el nombre del tag, SELLADO DENTRO de la imagen. No es
      #    redundante con la etiqueta del registry: la del registry se puede
      #    mover y de hecho se movió (la vieja `v0.5.0` acabó renombrada
      #    `v0.5.0-09sep`); esta viaja con el digest y delata el renombrado.
      #  · `source`    — la URL del repositorio, derivada del contexto. Un SHA
      #    suelto no basta cuando el proyecto tiene DOS remotos y uno está
      #    muerto (`CLAUDE.md` §6): sin esto, `revision` no dice dónde buscar.
      #  · `created`   — el instante del build en RFC 3339. Lo que el registry
      #    guarda es la hora del PUSH, que no es la misma, y ordenar dos
      #    candidatas en el tiempo fue justo el primer paso del 14/09.
      #
      # DESCARTADAS a propósito, para que esto no sea una colección: `title`,
      # `description`, `documentation` y `authors` son prosa fija que no ayuda a
      # diagnosticar nada; `vendor` y `url` obligarían a quemar un dominio real
      # en un archivo versionado, que `CLAUDE.md` prohíbe; `licenses` sería una
      # afirmación legal que nadie ha decidido; `base.name`/`base.digest`
      # servirían a la cadena de suministro pero exigen plomería aparte y no
      # tienen que ver con B36.
      #
      # Los valores viajan como VARIABLES DE ENTORNO, igual que el resto del
      # archivo y por el motivo de la cabecera: un `${{ ... }}` dentro del texto
      # de un script se sustituye antes de que exista el shell.
      - name: Construir la imagen
        env:
          REVISION: ${{ github.sha }}
          FUENTE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # UTC y con `Z` explícita: RFC 3339, que es lo que pide la
          # especificación OCI para `created`. La hora local del runner no
          # significa nada para quien lee la imagen tres semanas después.
          CREADA=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          docker build \
            --build-arg VERSION="$VERSION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.source=$FUENTE" \
            --label "org.opencontainers.image.created=$CREADA" \
            --tag "$REGISTRY/space-os:$VERSION" \
            --tag "$REGISTRY/space-os:beta" \
            .

      # Se LEE lo que se acaba de escribir, antes de publicar nada. El repositorio
      # ya pagó caro afirmar como hecho algo que nadie midió (el cierre en falso de
      # F2.4 el 01/09), así que aquí la etiqueta no se da por puesta: se pregunta.
      #
      # Fail-closed y ANTES del push, que es lo que lo hace barato: si esto se
      # pone rojo no hay nada publicado a medias, solo una imagen local que muere
      # con el runner. Compárese con la lectura del digest del paso siguiente, que
      # SÍ lleva `|| echo` porque ocurre DESPUÉS del push y un rojo allí diría «no
      # se publicó» y sería mentira.
      - name: Comprobar que la imagen sabe de que commit salio
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          LEIDA=$(docker inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$REGISTRY/space-os:$VERSION")
          if [ "$LEIDA" != "$REVISION" ]; then
            echo "::error::La imagen no lleva el commit encima: se esperaba '$REVISION' y se leyó '$LEIDA'."
            echo "Sin esa etiqueta, una imagen del registry no puede decir de qué código salió (B36)."
            exit 1
          fi
          echo "org.opencontainers.image.revision = $LEIDA"

      # El ÚLTIMO paso del último job. Todo lo anterior es el gate.
      #
      # Primero la etiqueta de versión y después `beta`, en ese orden y no al
      # revés: la de versión es inmutable y `beta` es un puntero que se mueve.
      # Si el primer push falla, `beta` se queda donde estaba, apuntando al
      # release anterior que sí está entero.
      - name: Publicar en el canal beta
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/space-os:$VERSION"
          docker push "$REGISTRY/space-os:beta"

          # El digest queda escrito en el resumen del run: es lo que F2.4
          # compara al promover a `estable`, donde promover NO debe cambiarlo.
          #
          # Con `|| echo` a propósito: el push ya ocurrió, y que falle LEER el
          # digest no puede teñir de rojo una publicación que salió bien. Un rojo
          # aquí diría «no se publicó» y sería mentira.
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/space-os:$VERSION" 2>/dev/null || echo 'no disponible')
          {
            echo "### Publicado en el canal \`beta\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Versión | \`$VERSION\` |"
            echo "| Etiquetas | \`$VERSION\` y \`beta\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Commit (\`org.opencontainers.image.revision\`) | \`$REVISION\` |"
            echo ""
            echo "Pasó typecheck, unitarias y e2e. \`estable\` no se toca aquí: eso es \`promover.yml\`."
            echo ""
            echo "El commit va DENTRO de la imagen, no solo en este resumen — que es el punto de B36:"
            echo ""
            echo '```bash'
            echo "docker buildx imagetools inspect \"\$REGISTRY/space-os:$VERSION\" --format '{{json .Image}}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Que no quede el token en `~/.docker/config.json` del runner. El runner
      # es efímero, así que es defensa en profundidad, no la única barrera.
      - name: Cerrar la sesión del registry
        if: always()
        run: docker logout "${REGISTRY%%/*}" || true

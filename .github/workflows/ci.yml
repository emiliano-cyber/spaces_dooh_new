name: CI

# ============================================================================
#  Verificación de cada PR: typecheck, pruebas y build de producción.
#
#  Hasta ahora ningún workflow corría las pruebas, y el typecheck y el build solo
#  se hacían en `deploy.yml`, que se disparaba en `main`: cuando fallaban, ya
#  estaba mergeado. En los PRs solo corría `lockfile-check`, así que un PR en
#  verde no significaba gran cosa.
#
#  El build va incluido a propósito, aunque sea el paso más lento. El modo de
#  fallo que cierra no es hipotético: la rama de la Fase 1 llegó a quedarse sin
#  compilar en un clon limpio porque unos módulos que se importaban nunca se
#  habían commiteado (ver 1d76f15). En el working tree todo pasaba; en un clon,
#  no. Un runner siempre parte de un clon limpio, que es justo lo que hace falta.
#
#  SEGURIDAD — dos cosas que deben quedarse como están:
#
#   · El disparador es `pull_request` y NO `pull_request_target`. La diferencia
#     importa: `pull_request_target` corre con los secretos del repo y con el
#     contexto del repositorio base, así que un PR desde un fork podría alterar
#     lo que se ejecuta —un script de build, una dependencia— y quedarse con los
#     secretos. Con `pull_request` el código no confiable corre sin secretos.
#   · Este workflow no necesita ningún secreto y no debe recibirlos nunca. Si
#     algún día hace falta desplegar o publicar algo, va en OTRO workflow con su
#     propio disparador, no aquí.
#
#  `permissions: contents: read` aplica el mismo criterio al GITHUB_TOKEN: solo
#  leer el repo. Sin esto hereda los permisos por defecto de la organización, que
#  pueden incluir escritura.
# ============================================================================

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo al PR cancela la corrida anterior: lo que importa es el último
# commit, y las anteriores solo gastan minutos y confunden el estado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · pruebas · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` y no `npm install`: instala exactamente lo que dice el lockfile
      # y falla si package.json y package-lock.json no están en sync, en vez de
      # arreglarlo por su cuenta y hacer que el CI pruebe otro árbol de
      # dependencias que el de nadie más.
      - name: Instalar dependencias
        run: npm ci

      # De más rápido a más lento, para que el fallo llegue cuanto antes.
      - name: Typecheck
        run: npx turbo run typecheck --filter=web

      # `--filter=flota` ademas de `web`: el panel de flota es un workspace
      # aparte (F6.2) y con el filtro solo en `web` sus pruebas NO LAS CORRIA
      # NADIE. Ocho casos que nadie ejecuta se pudren en silencio, y el panel
      # es justo lo que avisa de que una instancia se quedo atras.
      #
      # No se quita el filtro del todo: `typecheck` y `build` siguen siendo de
      # `web`, que es lo unico que se empaqueta en la imagen.
      - name: Pruebas
        run: npx turbo run test --filter=web --filter=flota

      # Los guiones de infraestructura NO son un workspace de npm, asi que no
      # entran por turbo: se corren aparte. Y hacen falta aqui porque el
      # 2026-09-07 aparecieron SEIS defectos en `provision-instancia.sh` en un
      # solo dia —el unico guion grande que no tenia arnes, y el que crea las
      # maquinas de los clientes—. Los de `update.sh` los caza su arnes antes de
      # produccion; aquellos los cazo un droplet cobrandose.
      #
      # Ninguno de los dos sale a la red ni toca una maquina: montan dobles de
      # `ssh`, `doctl`, `docker` y `curl` en un PATH propio.
      - name: Pruebas del aprovisionamiento
        run: bash infra/scripts/pruebas-provision.sh

      # Y los mutantes, que son lo que convierte el arnes en una verificacion:
      # deshacen cada uno de los seis arreglos y comprueban que el escenario
      # correspondiente se pone rojo. Un arnes en verde solo dice que hoy no
      # falla; los mutantes dicen que si alguien deshace el arreglo, se entera.
      - name: Mutantes del aprovisionamiento
        run: bash infra/scripts/pruebas-provision.sh --mutantes

      - name: Build de producción
        run: npx turbo run build --filter=web

  # ==========================================================================
  #  Integración (e2e) — contra un Postgres de verdad
  # --------------------------------------------------------------------------
  #  Trabajo APARTE del de arriba, y a propósito: necesita un servicio de base
  #  de datos y tarda varios minutos. Separado, el typecheck y las unitarias
  #  siguen dando su rojo en el primer minuto.
  #
  #  ─── Por qué hacía falta, y está medido ──────────────────────────────────
  #  Hasta hoy las e2e solo corrían en la máquina de quien las escribía. El
  #  2026-09-07 eso dejó **B4 sin verificar**: sus cuatro casos estaban escritos
  #  y vistos en rojo, y Docker Desktop empezó a matar los contenedores cada
  #  ~20 s. Sin el 5433 no hay e2e — y la parte que estas pruebas cubren es
  #  justo la que las unitarias NO pueden ver: **simulan la base, así que un
  #  fallo de RLS les pasa por delante sin enterarse**.
  #
  #  Dicho de otra forma: un PR que toque `auth`, `tenant` o una migración podía
  #  ponerse verde aquí sin que nadie hubiera comprobado lo único que importa de
  #  ese cambio. Eso se acaba.
  #
  #  La base se llama `spaces_e2e` porque `db-e2e.ts` EXIGE que el nombre acabe
  #  en `_e2e` o `_test` antes de hacer `drop schema public cascade`. Ese guard
  #  no se toca: es lo que impide que el arnés apunte por error a una base con
  #  datos de alguien.
  #
  #  El rol `spaces_app` no se crea aquí: lo crea `db/dev-rol-app.sql`, que
  #  `recrearEsquema()` aplica antes que nada. Y ese rol importa — es
  #  `NOSUPERUSER NOBYPASSRLS`, o sea que con él la RLS se aplica de verdad. Con
  #  el superusuario, media suite pasaría por el motivo equivocado.
  # ==========================================================================
  e2e:
    name: Integración · Postgres real
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spaces
          POSTGRES_PASSWORD: spaces
          POSTGRES_DB: spaces_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaces -d spaces_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Las dos URLs que `db-e2e.ts` deja sobreescribir. En local apuntan al
      # 5433 del docker-compose; aquí, al servicio de arriba.
      DATABASE_URL_TEST: postgresql://spaces:spaces@localhost:5432/spaces_e2e
      DATABASE_URL_TEST_APP: postgresql://spaces_app:spaces_app_dev@localhost:5432/spaces_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # El build va ANTES y no es opcional: `servidor-e2e.ts` arranca con
      # `npx next start`, que REUTILIZA el build existente y no construye nada.
      # Sin `.next/BUILD_ID` mueren TODOS los archivos con «El servidor de
      # pruebas no respondió … tras 60 s» — y tardan diez minutos en hacerlo,
      # con un rojo que no dice nada del código.
      - name: Build de producción (lo exige el arnés e2e)
        run: npx turbo run build --filter=web

      - name: Pruebas de integración
        working-directory: apps/web
        run: npm run test:e2e

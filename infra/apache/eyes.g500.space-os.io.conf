# ============================================================================
#  eyes.g500.space-os.io — el Space Eye de g500, por HTTPS
# ----------------------------------------------------------------------------
#  POR QUE APACHE Y NO CADDY. El compose de produccion trae Caddy con HTTPS
#  automatico, y es lo que conviene en un droplet limpio. Pero en ESTE droplet
#  Apache 2.4.58 ya es el dueno del 80 y del 443 -sirve market.adavailable.com
#  con su certificado-, asi que Caddy no podria tomar los puertos. Aqui el
#  frente de TLS es Apache y punto; el compose sigue siendo el de IP, sin tocar.
#
#  ESTE VHOST SIRVE V2, NO LA QUE LA GENTE USA. Producción -V1- sigue sola en
#  el 4000, con sus contenedores, sus volumenes y su base, y los equipos en
#  campo -que apuntan a `http://159.203.188.58:4000`, la APK lo lleva compilado-
#  entran por ahi sin enterarse de nada.
#
#      http://<ip>:4000               V1, la de siempre, intacta
#      https://eyes.g500.space-os.io  V2, lo nuevo, por aqui
#
#  Por eso el proxy apunta al 4100 y al 8989, que son los puertos de V2. El dia
#  que V2 pase a ser la buena, se cambian estas dos lineas al 4000 y al 8889 y
#  se apaga la pila V2; hasta entonces conviven sin rozarse.
#
#  Modulos necesarios:
#    a2enmod proxy proxy_http proxy_wstunnel ssl rewrite headers
# ============================================================================

<VirtualHost *:80>
    ServerName eyes.g500.space-os.io

    # El desafio de Let's Encrypt tiene que poder entrar por http, o la
    # renovacion falla dentro de 90 dias -en silencio, y el sitio se cae solo-.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName eyes.g500.space-os.io

    SSLEngine on
    # Las pone certbot al emitir el certificado (ver el runbook). Se dejan
    # escritas para que se vea de donde salen.
    SSLCertificateFile    /etc/letsencrypt/live/eyes.g500.space-os.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/eyes.g500.space-os.io/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    # NO se pone LimitRequestBody, y es a proposito.
    #
    #  La primera version lo llevaba, con un comentario diciendo que cortaba las
    #  subidas grandes. Se probo en el ensayo -Apache 2.4.58, el mismo del
    #  droplet- y NO es cierto: con el tope en 1 KB, un cuerpo de 10 KB llega
    #  igual al backend, tanto en el vhost como dentro de un <Location>. La
    #  directiva no se aplica a lo que se reenvia por mod_proxy.
    #
    #  El limite de verdad vive donde si se cumple: multer en el backend, 20 MB
    #  por foto (backend/src/routes/index.ts). Dejar aqui una linea que promete
    #  algo que no hace es peor que no tenerla: el dia que alguien confie en
    #  ella, no habra nada detras.

    # ─── La vista en vivo ────────────────────────────────────────────────────
    #
    #  VA PRIMERO, y el orden importa: en Apache gana la primera regla que case,
    #  asi que si el `ProxyPass /` estuviera arriba se llevaria tambien esto.
    #
    #  El navegador pide el WHEP por aqui, en el mismo dominio y certificado que
    #  la pagina que lo abre. Una pagina https NO puede abrir un WHEP en http: lo
    #  bloquea como contenido mixto y el unico rastro es una linea en la consola.
    #
    #  El backend arma esta direccion con MEDIAMTX_WHEP_PUBLIC, que tiene que
    #  ser exactamente `https://eyes.g500.space-os.io/whep`.
    #
    #  Los MEDIOS no pasan por aqui: van por UDP 8189 directos contra MediaMTX.
    #  Esto solo lleva el intercambio de SDP.
    ProxyPass        /whep/ http://127.0.0.1:8989/
    ProxyPassReverse /whep/ http://127.0.0.1:8989/

    # ─── socket.io: por donde llegan las ordenes a los equipos ──────────────
    #
    #  Sin la regla de WebSocket, socket.io se cae a sondeo largo y las ordenes
    #  tardan; con equipos en LTE eso se nota. Va antes del proxy general por el
    #  mismo motivo de orden.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*)$ ws://127.0.0.1:4100/socket.io/$1 [P,L]

    # ─── Todo lo demas: la API y el dashboard de operacion ──────────────────
    ProxyPass        / http://127.0.0.1:4100/
    ProxyPassReverse / http://127.0.0.1:4100/

    # La IP real del cliente, para los limitadores del backend.
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/eyes-g500-error.log
    CustomLog ${APACHE_LOG_DIR}/eyes-g500-access.log combined
</VirtualHost>

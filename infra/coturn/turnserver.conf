# SPACE EYE — configuracion de coturn (servidor TURN)
# EDITA los 3 valores marcados con REPLACE_ antes de desplegar.
#
# Abre en el firewall del VPS: 3478/udp, 3478/tcp y el rango relay 49160-49200/udp.

listening-port=3478

# Sin listening-ip: escucha en TODAS las interfaces, incluida la IPv6. Eso es lo
# que permite que un equipo en una red movil IPv6 pura (Telcel ya las reparte)
# alcance el TURN; el relay que recibe sigue siendo IPv4, que es justo lo que el
# navegador puede usar. Sin esto, esos equipos no pueden transmitir aunque las
# fotos y la telemetria les funcionen.
#
# Los relays SIEMPRE en la IPv4 publica. Sin esta linea coturn elige cualquier
# interfaz local y llego a anunciar el puente de Docker (172.18.0.1), que es
# inalcanzable desde fuera.
relay-ip=REPLACE_WITH_PUBLIC_IP

# external-ip solo hace falta si el VPS esta detras de NAT (la IP publica NO
# aparece en la interfaz). En un droplet normal se deja comentado: con una IPv4
# fija aqui, coturn la aplicaba tambien a las sesiones IPv6 y sus asignaciones
# quedaban sin responder. OJO: coturn NO admite mas de una linea external-ip
# ("You cannot define external IP more than once").
# external-ip=REPLACE_WITH_PUBLIC_IP

# Autenticacion por secreto compartido (TURN REST API). DEBE ser identico a
# TURN_SECRET del backend (.env). El backend genera credenciales temporales.
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SECRET

# Tu dominio.
realm=REPLACE_WITH_DOMAIN

fingerprint
# Rango de puertos para los relays (mantenerlo acotado y abrirlo en el firewall).
min-port=49160
max-port=49200

# Endurecimiento basico.
no-cli
no-multicast-peers
stale-nonce=600
# Evita relays hacia direcciones privadas/loopback.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

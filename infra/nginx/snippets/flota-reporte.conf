# ============================================================================
#  El receptor de reportes de flota (F6.4) — SOLO en el PADRE.
# ----------------------------------------------------------------------------
#  Se incluye desde el bloque 443 de `space-os.io.conf` con UNA línea:
#
#      include /var/www/Spaces/infra/nginx/snippets/flota-reporte.conf;
#
#  Va en snippet aparte y no dentro del conf a propósito: el conf vivo sostiene
#  `space-os.io` y `demo.space-os.io`, y así el diff que aprueba una persona es
#  de una línea y la vuelta atrás es borrarla.
#
#  ─── POR QUÉ ESTO NO ES UNA RUTA DE LA APP ─────────────────────────────────
#  El artefacto es IDÉNTICO para toda la flota (invariante 3). El receptor es
#  del PADRE y solo del PADRE: si viviera en `apps/web` viajaría dentro de la
#  imagen que corre cada owner en su propio servidor, y con él la lista de
#  instancias. Por eso `apps/flota` queda fuera del `--filter=web` del
#  `Dockerfile`, y por eso esta ruta la sirve nginx y no Next.
#
#  ─── LO QUE ESTE BLOQUE PROTEGE, Y LO QUE NO ───────────────────────────────
#  Protege: que el receptor no sea alcanzable sin TLS, que no le lleguen cuerpos
#  enormes y que no se pueda usar para inundar el disco del padre.
#
#  NO protege la autenticación: eso lo hace `reporte.mjs`, que valida el
#  `x-flota-token` contra el inventario y comprueba que el token y el cuerpo
#  digan LA MISMA instancia. nginx no conoce los tokens y no debe conocerlos.
# ============================================================================

# El límite vive fuera de `server` en `nginx.conf` (contexto `http`). Se declara
# aquí como recordatorio de que hace falta, no porque este archivo lo cree:
#   limit_req_zone $binary_remote_addr zone=flota:1m rate=12r/m;
#
# 12 por minuto es holgado para lo que hace una instancia —un reporte al final
# de cada `update.sh` y uno al día por cron— y estrecho para cualquier otra
# cosa. Si algún día la flota crece a cientos, se sube aquí y no en el emisor.

location = /flota/reporte {
  # `=` y no un prefijo: esta es UNA ruta exacta. Con `location /flota/` un
  # `/flota/reporte/../../algo` acabaría en el proxy, y el receptor contesta 404
  # a cualquier otra ruta pero no tiene por qué llegar a decidirlo.

  limit_req zone=flota burst=4 nodelay;

  # Solo POST. El receptor ya contesta 404 a un GET, pero rechazarlo aquí evita
  # que un rastreador llegue siquiera a levantar la conexión al proceso.
  limit_except POST { deny all; }

  # El receptor corta en su propio máximo; esto lo corta antes de que el cuerpo
  # llegue a viajar entero. El reporte de F6.1 más `instancia` son ~200 bytes:
  # 8k es tres órdenes de magnitud de margen y sigue siendo un techo real.
  client_max_body_size 8k;

  # 127.0.0.1 y no un socket de red: el receptor escucha SOLO en loopback
  # (`reporte.mjs:219`). Quien termina TLS y mira el `Host` es este nginx.
  proxy_pass http://127.0.0.1:8787;

  include /var/www/Spaces/infra/nginx/snippets/proxy-app.conf;

  # El receptor escribe un archivo por reporte. Un emisor que se cuelgue a mitad
  # no debe dejar una conexión abierta esperando: bastante más corto que el
  # `proxy_read_timeout` de la app, que sirve páginas.
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;

  # Nada de esto se cachea nunca.
  add_header Cache-Control "no-store" always;
}

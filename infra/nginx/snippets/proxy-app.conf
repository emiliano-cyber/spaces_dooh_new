# ============================================================================
#  Encabezados del proxy hacia la app Next. UNA sola copia, incluida por todos
#  los vhosts.
# ----------------------------------------------------------------------------
#  Existe porque `space-os.io.conf` sirve DOS sitios y las cabeceras tienen que
#  ser idénticas: si divergen, lo que se prueba en uno deja de decir nada sobre
#  el otro. Antes se copiaban a mano entre `demo.space-os.io.conf` y
#  `padre-ip.conf`, con un comentario pidiendo que no divergieran — que es la
#  forma educada de decir que iban a divergir.
#
#  Se incluye DENTRO de un `location`, después de su `proxy_pass`.
# ============================================================================

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# ⚠️ DELIBERADO: `$remote_addr` y NO `$proxy_add_x_forwarded_for`.
#
# `ipDe()` (apps/web/lib/server/rate-limit.ts) toma el PRIMER valor de la
# cabecera. Encadenar lo que mande el cliente permitiría falsificar la IP y
# saltarse el límite de 10 intentos de login por IP. Reescribiéndola con el
# valor que nginx conoce, el dato es siempre confiable.
#
# Con el snippet de Cloudflare instalado, `$remote_addr` ya es la IP real del
# visitante y no la del proxy.
#
# ESTA LÍNEA NO SE TOCA.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_cache_bypass $http_upgrade;

proxy_connect_timeout 10s;
proxy_read_timeout    75s;
proxy_send_timeout    75s;

# ============================================================================
#  El panel de flota (ADR 0026), dentro del vhost de space-os.io.
#
#  Convive con `flota-reporte.conf` sin pelearse: aquel es `location = /flota/
#  reporte` (coincidencia EXACTA) y este es un prefijo. En nginx la exacta gana,
#  asi que el receptor sigue recibiendo POST igual.
#
#  La barra final del `proxy_pass` RECORTA el prefijo: el panel recibe `/`.
#  `servidor.mjs` acepta `/flota/`, `/flota` y `/` justamente por esto -- si
#  algun dia se quita la barra, sigue funcionando.
#
#  La cookie de sesion viaja sola: nginx reenvia las cabeceras de la peticion, y
#  es lo unico que el panel necesita para preguntarle al PADRE quien es.
# ============================================================================
location /flota/ {
  proxy_pass http://127.0.0.1:3002/;
  include /var/www/Spaces/infra/nginx/snippets/proxy-app.conf;
  add_header Cache-Control "no-store" always;
}

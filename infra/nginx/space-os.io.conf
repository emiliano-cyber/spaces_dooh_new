# ============================================================================
#  space-os.io + demo.space-os.io — el PADRE y DEMO, en la MISMA máquina.
#  Destino: /etc/nginx/sites-available/spaces  (symlink en sites-enabled/)
# ----------------------------------------------------------------------------
#  Sustituye a `padre-ip.conf`, que servía por IP y sin TLS. Y NO sustituye a
#  `demo.space-os.io.conf`: aquel se queda como **plantilla de una instancia de
#  owner** —una máquina, un dominio, un proceso— que es lo que usará la Fase 5.
#  Este archivo es específico del arreglo del 2026-08-24: dos sitios en un solo
#  droplet.
#
#  ┌────────────────────────┬──────────────────┬──────────────────────────────┐
#  │ Nombre                 │ Proxy a          │ Qué es                       │
#  ├────────────────────────┼──────────────────┼──────────────────────────────┤
#  │ space-os.io            │ 127.0.0.1:3000   │ El PADRE (plano de control)  │
#  │ demo.space-os.io       │ 127.0.0.1:3001   │ DEMO (datos de juguete)      │
#  └────────────────────────┴──────────────────┴──────────────────────────────┘
#
#  ⚠️ LO QUE ESTE ARCHIVO NO PUEDE HACER, Y CONVIENE SABERLO
#
#  Separa los dos sitios por nombre, por puerto, por proceso y por base. NO los
#  separa de verdad: comparten kernel, disco y red. Quien consiga ejecutar
#  código en el proceso de DEMO —el sitio público, el de más superficie— está
#  dentro de la máquina que guarda el super admin de TODA la flota. Es el precio
#  de la decisión del 24/08 y está aceptado; no es un descuido de esta config.
#
#  Lo que sí compensa aquí: DEMO corre con su propio usuario del sistema y su
#  propia base, y no lleva ni las llaves ni la configuración del PADRE.
#
#  ─── Instalar ──────────────────────────────────────────────────────────────
#
#      # 1. El certificado TIENE que existir ANTES (DNS-01, ver el runbook)
#      certbot certificates | grep -A2 'space-os.io'
#
#      # 2. Enlazar y retirar lo provisional
#      ln -sf /var/www/Spaces/infra/nginx/space-os.io.conf \
#             /etc/nginx/sites-enabled/spaces
#      rm -f /etc/nginx/sites-enabled/padre-ip
#      rm -f /etc/nginx/sites-enabled/default
#      nginx -t && systemctl reload nginx
#
#  ⚠️ `nginx -t` NO BASTA COMO COMPROBACIÓN. El 2026-08-21 dijo «ok» sobre una
#  configuración CORRUPTA: pegarla en la consola web duplicó líneas y el
#  resultado seguía siendo sintácticamente válido. La única señal fue el
#  COMPORTAMIENTO. Por eso se enlaza el archivo del repositorio —no se pega— y
#  por eso se comprueba con códigos de respuesta:
#
#      curl -s -o /dev/null -w '%{http_code}\n' https://space-os.io/            # 302
#      curl -s -o /dev/null -w '%{http_code}\n' https://space-os.io/spaces-dooh/login/       # 200
#      curl -s -o /dev/null -w '%{http_code}\n' https://demo.space-os.io/spaces-dooh/login/  # 200
#      curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#           https://demo.space-os.io/spaces-dooh/api/signup/                    # 503
#
#  ─── Cloudflare ────────────────────────────────────────────────────────────
#
#  Medido el 2026-08-24: el proxy está en GRIS (la respuesta no trae `cf-ray`).
#  Si algún día se pone en naranja, hace falta
#  /etc/nginx/conf.d/cloudflare-realip.conf (ver `cloudflare-realip.sh`): sin él
#  TODO el tráfico parece venir de una sola IP y el limitador de intentos de
#  login bloquearía a todos a la vez.
# ============================================================================

# WebSockets: `Connection` debe ser "upgrade" SOLO cuando el cliente lo pide.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream spaces_padre {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream spaces_demo {
  server 127.0.0.1:3001;
  keepalive 32;
}

# ── Bloque común de proxy ───────────────────────────────────────────────────
# Los dos sitios usan EXACTAMENTE los mismos encabezados, y eso es deliberado:
# si divergen, lo que se prueba en uno deja de decir nada sobre el otro. Vive en
# un archivo aparte para que no haya dos copias que se desincronicen.
#   -> infra/nginx/snippets/proxy-app.conf

# ── 1. Catch-all: cualquier acceso que NO sea por un nombre conocido ────────
# Cubre la IP pública, hosts vacíos y subdominios equivocados. Manda al PADRE,
# que es el sitio "de la casa".
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # ACME primero: aunque hoy se emite por DNS-01, dejar el hueco cuesta nada y
  # salva el día que alguien tenga que emitir por HTTP-01 a las 3 de la mañana.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://space-os.io$request_uri;
  }
}

# ── 2. HTTP → HTTPS, para los dos nombres ───────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name space-os.io demo.space-os.io;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── 3. HTTPS · space-os.io → el PADRE ───────────────────────────────────────
server {
  # Sintaxis de nginx < 1.25.1 (el servidor corre 1.24.0). En 1.25.1+ esto se
  # escribe `listen 443 ssl;` + `http2 on;`.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name space-os.io;

  ssl_certificate     /etc/letsencrypt/live/space-os.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/space-os.io/privkey.pem;

  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;

  client_max_body_size 12M;

  # HSTS vive AQUI y no en next.config.mjs: en un solo sitio, y asi aplica
  # tambien a las respuestas que no pasan por la app.
  #
  # ⚠️ SIN `preload`, y es una decision. `includeSubDomains` sobre el APICE
  # obliga a HTTPS a TODO subdominio de space-os.io durante dos años, presentes
  # y futuros. Ya hay uno (demo) que va por HTTPS, asi que hoy no rompe nada;
  # pero un subdominio nuevo sin certificado quedaria inaccesible y NO habria
  # forma de saltarselo desde el navegador. Medido el 24/08 en la maquina vieja:
  # ese HSTS es justo lo que convierte un error de certificado en un sitio
  # bloqueado. Se deja el `includeSubDomains` porque no hay planes de servir
  # nada por HTTP, y se deja FUERA el `preload` porque de la lista de precarga
  # no se sale en meses.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   5;
  gzip_min_length   1024;
  gzip_types        text/plain text/css text/javascript application/javascript
                    application/json application/x-javascript image/svg+xml
                    application/manifest+json;

  # ── El receptor de reportes de flota (F6.4) ───────────────────────────────
  # SOLO en el apice: el receptor es del PADRE. El bloque de `demo.space-os.io`
  # NO lo incluye, y eso es la decision, no un olvido -- una instancia no recibe
  # los reportes de las demas.
  include /var/www/Spaces/infra/nginx/snippets/flota-reporte.conf;

  location / {
    proxy_pass http://spaces_padre;
    include    /var/www/Spaces/infra/nginx/snippets/proxy-app.conf;
  }

  location /spaces-dooh/_next/static/ {
    proxy_pass http://spaces_padre;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    access_log off;
  }

  location = / {
    return 302 /spaces-dooh/login/;
  }
}

# ── 4. HTTPS · demo.space-os.io → DEMO ──────────────────────────────────────
#
# Este bloque es el que RECUPERA el nombre: hasta el 2026-08-24 apuntaba a
# 209.97.146.136, la maquina a la que se perdio el acceso. Reapuntarlo aqui es
# lo que cumple el criterio 3 de F4.5 -- y se comprueba con un `dig`, no de
# palabra.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name demo.space-os.io;

  ssl_certificate     /etc/letsencrypt/live/space-os.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/space-os.io/privkey.pem;

  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;

  client_max_body_size 12M;

  # El mismo HSTS que ya servia la maquina vieja (medido el 24/08). Mantenerlo
  # es obligatorio, no opcional: los navegadores que visitaron ese nombre lo
  # tienen fijado a HTTPS hasta 2028. Quitarlo no los "libera" -- solo dejaria
  # de renovar el plazo.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   5;
  gzip_min_length   1024;
  gzip_types        text/plain text/css text/javascript application/javascript
                    application/json application/x-javascript image/svg+xml
                    application/manifest+json;

  location / {
    proxy_pass http://spaces_demo;
    include    /var/www/Spaces/infra/nginx/snippets/proxy-app.conf;
  }

  location /spaces-dooh/_next/static/ {
    proxy_pass http://spaces_demo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    access_log off;
  }

  location = / {
    return 302 /spaces-dooh/login/;
  }
}

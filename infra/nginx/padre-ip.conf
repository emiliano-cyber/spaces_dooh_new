# ─── padre-ip.conf ────────────────────────────────────────────────────────────
#  El PADRE servido POR IP, sin HTTPS. Es un estado PROVISIONAL y se retira en
#  cuanto haya dominio: entonces se usa `demo.space-os.io.conf` como plantilla,
#  que ya trae TLS, HSTS y el hueco de `.well-known/acme-challenge`.
#
#  ⚠️ CON ESTO NO SE PUEDE INICIAR SESION, y no es un defecto de nginx.
#  En produccion la cookie de sesion sale con el atributo `Secure`
#  (`apps/web/lib/server/auth.ts:184-188`), y un navegador NO manda una cookie
#  `Secure` por HTTP. La pantalla de acceso carga, el login contesta 200, y la
#  sesion no persiste: te devuelve al login sin explicar nada.
#
#  Ese `Secure` esta puesto a proposito —el comentario del codigo lo dice: «asi
#  prod nunca manda la sesion en claro por un olvido de env»— y NO se apaga con
#  `COOKIE_SECURE=0`: eso haria viajar sin cifrar la sesion del super admin de
#  toda la flota.
#
#  Para usar la aplicacion completa hoy, sin dominio y sin bajar defensas:
#      ssh -L 3000:localhost:3000 root@<IP>
#      y abrir http://localhost:3000/spaces-dooh/login/
#  El navegador ve `localhost`, asi que la cookie no estorba y todo va cifrado
#  dentro del tunel.
#
#  Instalar:
#      ln -sf /var/www/Spaces/infra/nginx/padre-ip.conf /etc/nginx/sites-enabled/padre-ip
#      rm -f /etc/nginx/sites-enabled/default      # trae su propio default_server
#      nginx -t && systemctl reload nginx
#
#  Los encabezados del proxy son los MISMOS que los de `demo.space-os.io.conf`,
#  copiados a proposito: si divergen, lo que se prueba aqui deja de decir nada
#  sobre lo que pasara con dominio.
# ──────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream spaces_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 12M;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   5;
  gzip_min_length   1024;
  gzip_types        text/plain text/css text/javascript application/javascript
                    application/json application/x-javascript image/svg+xml
                    application/manifest+json;

  # La raiz manda al acceso. Va ANTES del `location /` por claridad, aunque en
  # nginx el `= /` gana siempre por ser coincidencia exacta.
  location = / {
    return 302 /spaces-dooh/login/;
  }

  # Los estaticos de Next: sin `access_log` y sin cabeceras de reenvio, que no
  # hacen falta para un archivo inmutable.
  location /spaces-dooh/_next/static/ {
    proxy_pass http://spaces_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    access_log off;
  }

  location / {
    proxy_pass         http://spaces_web;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout    75s;
    proxy_send_timeout    75s;
  }
}

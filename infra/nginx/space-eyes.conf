# ============================================================================
#  space-eyes.conf — el Space Eye de ESTA instancia, por SU MISMO dominio.
#  Destino: /etc/nginx/snippets/space-eyes.conf (lo instala eyes_archivos).
# ----------------------------------------------------------------------------
#  instancia.conf.tpl lo incluye con un comodín
#  (`include /etc/nginx/snippets/space-eyes*.conf;`). Una instancia sin Space
#  Eye no tiene este archivo y el comodín no incluye nada, sin error.
#
#  No hay subdominio aparte. Los equipos de la empresa (APK, Raspberry, PC)
#  hablan con https://<dominio de la instancia>, que es SU droplet, y con nadie
#  más. Mudar el droplet es mover el registro A del dominio, y los equipos no
#  se tocan.
#
#  Estas rutas no chocan con SPACE OS: la app vive entera bajo /spaces-dooh.
#  El panel propio de Space Eye (sus páginas .html) NO se publica: la app le
#  habla por 127.0.0.1:4200.
#
#  El video no pasa por aquí. Va por RTSP 8554, UDP 8189 y TURN 3478 a la IP
#  del droplet (MEDIAMTX_HOST y TURN_URL los arma el compose con IP_PUBLICA),
#  así que funciona aunque el dominio esté detrás del proxy de Cloudflare.
# ============================================================================

# El vivo: solo el SDP (WHEP). Los medios van por UDP directo a MediaMTX.
location ^~ /whep/ {
  proxy_pass         http://127.0.0.1:8889/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_buffering off;
}

# API de los equipos, socket.io (órdenes en tiempo real) y fotos firmadas.
location ~ ^/(api|socket\.io|storage)/ {
  # Las fotos de los equipos llegan a resolución completa (3-5 MB, tope del
  # servidor 20 MB). Con los 12M de la app, una foto grande moriría en nginx
  # con 413 y el equipo la reintentaría para siempre.
  client_max_body_size 25M;
  proxy_pass         http://127.0.0.1:4200;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade    $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 10s;
  # socket.io mantiene la conexión abierta: con 75 s se cortaría cada minuto.
  proxy_read_timeout    3600s;
  proxy_send_timeout    120s;
}

# Lo que bajan los equipos: la app, los agentes y sus manifiestos.
location ~ ^/(space-eye[a-z0-9.-]*\.(apk|json|tar\.gz)|SpaceEyeAgente\.exe|instalar-pi\.sh|ffmpeg\.exe)$ {
  proxy_pass         http://127.0.0.1:4200;
  proxy_http_version 1.1;
  proxy_set_header Host            $host;
  proxy_set_header X-Real-IP       $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Connection "";
}
